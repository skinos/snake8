
# No swap
vm.swappiness = 0

# Raise enough for high-BDP 5G paths; avoid multi-MB defaults that multiply across sockets.
net.core.wmem_max = 2097152
net.core.rmem_max = 2097152
net.core.wmem_default = 212992
net.core.rmem_default = 212992

# TCP autotuning min / default / max (bytes). Max aligned with wmem_max/rmem_max.
# IPv6: there are no separate net.ipv6.tcp_rmem / net.ipv6.tcp_wmem in mainline Linux;
# IPv6 TCP uses the same autotuning as net.ipv4.tcp_rmem and net.ipv4.tcp_wmem below.
net.ipv4.tcp_wmem = 4096 212992 2097152
net.ipv4.tcp_rmem = 4096 131072 2097152

# Ingress backlog before drops under bursts (packets).
net.core.netdev_max_backlog = 3000
net.ipv4.tcp_max_syn_backlog = 128

# More CPU time per poll cycle for RX under load (softirq). Tune down if idle latency suffers.
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 20000

# Discover path MTU issues often seen on cellular backhaul (black-hole avoidance).
net.ipv4.tcp_mtu_probing = 1

# Optional: less conservative slow-start restart after idle on bulk flows (can hurt fairness).
# Try A/B on your traffic; remove if latency jitter increases.
# net.ipv4.tcp_slow_start_after_idle = 0

# --- Connection tracking (RAM scales ~linearly with nf_conntrack_max).
# Start conservative; raise only if conntrack drops / table full messages appear.
net.netfilter.nf_conntrack_acct = 0
net.netfilter.nf_conntrack_max = 15360

# --- VM: keep a small emergency free pool for networking DMA / spikes (kB).
# Increase slowly if you see stalls under load; too high wastes RAM.
vm.min_free_kbytes = 8192

