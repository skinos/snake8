<script type="text/javascript">
var ovpns_prjpath;
var ovpns_prjlang;
(function () {
    var object = 'ovpns@server';
    var lastCfgSnapshot = null;
    var certPrefix = 'ovpns';
    var pagepath = base64.decode( page.param( 'page', location.hash ) );
    var langjson = base64.decode( page.param( 'lang', location.hash ) );
    var ciphers = [ 'AES-256-GCM', 'AES-128-GCM', 'CHACHA20-POLY1305', 'AES-256-CBC', 'AES-128-CBC' ];
    var client_table = '#ovpns-client-grid-table';
    var client_pager = '#ovpns-client-grid-pager';
    var online_table = '#ovpns-online-grid-table';
    var online_pager = '#ovpns-online-grid-pager';
    var clientRowSeq = 0;
    var onlineRowSeq = 0;
    var clientPendingStatus = null;
    var clientLastStatus = null;
    var clientTimer = null;
    var clientDataLoading = false;
    var onlineDataLoading = false;

    ovpns_prjpath = pagepath.substring( 0, pagepath.lastIndexOf( '/' ) );
    ovpns_prjlang = langjson;

    function select_or_keep( id, value, fallback )
    {
        var v = value || fallback;
        $( id ).val( v );
        if ( $( id ).val() !== v )
        {
            $( id ).append( $( '<option></option>' ).attr( 'value', v ).text( v ) );
            $( id ).val( v );
        }
    }

    function build_extern_select( cfg, iflist )
    {
        var cur;
        var k;

    function fill_net_rules( container, map )
    {

        var ent;

                {
                    continue;

                add_net_rule( container, ent.target || '', ent.mask || '' );

        $( '#static_group' ).toggle( auth === 'static' );
        $( '#radius_group' ).toggle( user );
        $( '#radius_sets' ).toggle( user && $( '#radius_status' ).prop( 'checked' ) );
        $( '#pkcs12_sets' ).toggle( auth !== 'static' && pkcs );
        $( '#split_cert_group' ).toggle( auth !== 'static' && !pkcs );
        $( '#tls_group' ).toggle( auth !== 'static' && $( '#hmac' ).val() !== 'disable' );
        $( '#revoke_group' ).toggle( auth === 'certificate' || auth === 'certificate+username' );

    function online_rxtx( one )
    {
        var rx;
        var tx;
        if ( !one )
        {
            return '';
        }
        rx = one.rx || '0';
        tx = one.tx || '0';
        if ( typeof byte2readable === 'function' )
        {
            return byte2readable( rx ) + ' / ' + byte2readable( tx );
        }
        return rx + ' / ' + tx;
    }

    function client_row_from_inst( fullpath, inst )
    {
        var raw = ( fullpath || '' ).replace( /^ovpns@/, '' );
        var cfgStatus = inst.status || 'disable';
        return {
            rid: String( ++clientRowSeq ),
            fullpath: fullpath,
            name: raw,
            cn: inst.cn || raw,
            tunnelip: inst.tunnelip || '',
            status: ( cfgStatus === 'enable' ) ? $.i18n( 'Enable' ) : $.i18n( 'Disable' )
        };
    }

    function client_online_count( st )
    {
        var clients = ( st && st.client && typeof st.client === 'object' ) ? st.client : {};
        var n = 0;
        var k;
        for ( k in clients )
        {
            if ( clients.hasOwnProperty( k ) && clients[k] )
            {
                n++;
            }
        }
        return n;
    }

    function client_show_online( st )
    {
        var n = client_online_count( st );
        if ( $( client_table )[0] && $( client_table )[0].grid )
        {
            $( client_table ).jqGrid( 'setCaption', $.i18n( 'OpenVPN Clients' ) );
        }
        if ( $( online_table )[0] && $( online_table )[0].grid )
        {
            $( online_table ).jqGrid( 'setCaption',
                $.i18n( 'Online Clients' ) + ' (' + n + ')' );
        }
    }

    function online_reload( st )
    {
        var clients = ( st && st.client ) ? st.client : {};
        var rows = [];
        var k;
        var one;
        var scrollPos;
        var currentPage;
        var currentRowNum;

        if ( !$( online_table )[0] || !$( online_table )[0].grid )
        {
            return;
        }
        onlineRowSeq = 0;
        for ( k in clients )
        {
            if ( !clients.hasOwnProperty( k ) || !clients[k] )
            {
                continue;
            }
            one = clients[k];
            rows.push( {
                rid: String( ++onlineRowSeq ),
                name: one.name || k,
                real: one.real || '',
                virtual: one.virtual || '',
                rxtx: online_rxtx( one ),
                since: one.since || '',
                serial: one.serial || ''
            } );
        }
        scrollPos = jqtable.getScrollPos();
        currentPage = $( online_table ).jqGrid( 'getGridParam', 'page' );
        currentRowNum = $( online_table ).jqGrid( 'getGridParam', 'rowNum' );
        $( online_table ).jqGrid( 'setGridParam', {
            data: rows,
            page: currentPage,
            rowNum: currentRowNum
        } ).trigger( 'reloadGrid' );
        jqtable.setScrollPos( scrollPos );
        $( online_table ).jqGrid( 'setCaption',
            $.i18n( 'Online Clients' ) + ' (' + rows.length + ')' );
        onlineDataLoading = false;
    }

    function client_apply_status( st )
    {
        client_show_online( st );
        online_reload( st );
        if ( !$( client_table )[0] || !$( client_table )[0].grid )
        {
            return false;
        }
        clientDataLoading = false;
        return true;
    }

    function client_cfg_load()
    {
        return he.load( [ object + '.clientlist' ] ).then( function ( v ) {
            var list_cfg = v[0] || {};
            var rows = [];
            var fullpath;
            var scrollPos;
            var currentPage;
            var currentRowNum;

            client_set_width();
            clientRowSeq = 0;
            for ( fullpath in list_cfg )
            {
                if ( !list_cfg.hasOwnProperty( fullpath ) || !list_cfg[fullpath] )
                {
                    continue;
                }
                rows.push( client_row_from_inst( fullpath, list_cfg[fullpath] ) );
            }
            scrollPos = jqtable.getScrollPos();
            currentPage = $( client_table ).jqGrid( 'getGridParam', 'page' );
            currentRowNum = $( client_table ).jqGrid( 'getGridParam', 'rowNum' );
            $( client_table ).jqGrid( 'setGridParam', {
                data: rows,
                page: currentPage,
                rowNum: currentRowNum
            } ).trigger( 'reloadGrid' );
            jqtable.setScrollPos( scrollPos );
            if ( clientPendingStatus )
            {
                client_apply_status( clientPendingStatus );
                clientPendingStatus = null;
            }
            else
            {
                client_show_online( clientLastStatus );
            }
        } );
    }

    function client_status_load()
    {
        return he.bkload( [ object + '.status' ] ).then( function ( v ) {
            var st = v[0] || {};
            clientLastStatus = st;
            if ( !client_apply_status( st ) )
            {
                clientPendingStatus = st;
                client_show_online( st );
                online_reload( st );
            }
        } );
    }

    function online_disconnect( real )
    {
        if ( !real )
        {
            return;
        }
        he.exec( [ object + '.disconnect[' + real + ']' ] ).then( function () {
            page.hint2succeed( $.i18n( 'Disconnect successfully' ) );
            client_status_load();
        } );
    }

    function client_add_instances( data )
    {
        var name = ( data.name || '' ).trim();
        if ( !name )
        {
            return;
        }
        he.exec( [ object + '.add[' + name + ']' ] ).then( function () {
            page.hint2succeed( $.i18n( 'Create successfully' ) );
            client_cfg_load().then( function () {
                client_status_load();
            } );
        } );
    }

    function client_del_instances( rowids )
    {
        var ids;
        var seq;
        if ( !rowids )
        {
            return;
        }
        ids = rowids.split( ',' );
        seq = $.when( 1 );
        $.each( ids, function ( _, rid ) {
            seq = seq.then( function () {
                var row = $( client_table ).jqGrid( 'getRowData', rid );
                if ( !row || !row.fullpath )
                {
                    return;
                }
                return he.exec( [ object + '.delete[' + row.fullpath + ']' ] );
            } );
        } );
        seq.done( function () {
            page.hint2succeed( $.i18n( 'Delete successfully' ) );
            client_cfg_load().then( function () {
                client_status_load();
            } );
        } );
    }

    function client_start_timer()
    {
        if ( clientTimer )
        {
            clearInterval( clientTimer );
        }
        clientTimer = setInterval( function () {
            var $grid = $( client_table );
            var $online = $( online_table );
            var selectedIds;
            if ( !$( '#statusSets' ).is( ':visible' ) )
            {
                return;
            }
            selectedIds = [];
            if ( $grid.length && $grid[0].grid )
            {
                selectedIds = $grid.jqGrid( 'getGridParam', 'selarrrow' ) || [];
            }
            if ( $online.length && $online[0].grid )
            {
                selectedIds = selectedIds.concat( $online.jqGrid( 'getGridParam', 'selarrrow' ) || [] );
            }
            if ( selectedIds.length > 0 || clientDataLoading || onlineDataLoading )
            {
                return;
            }
            if ( document.activeElement && $( document.activeElement ).hasClass( 'ui-pg-input' ) )
            {
                return;
            }
            clientDataLoading = true;
            onlineDataLoading = true;
            client_status_load();
        }, 2000 );
    }

    function key_load( keyStatus )
    {
        var files = [ 'ca', 'crt', 'key', 'p12', 'tlsauth', 'dh', 'static' ];
        if ( keyStatus === undefined )
        {
            he.load( [ object + '.key' ] ).then( function ( v ) {
                key_load( v[0] || {} );
            } );
            return;
        }
        files.forEach( function ( fileType ) {
            if ( keyStatus[fileType] )
            {
                $( '#' + certPrefix + '_' + fileType + '_down' ).show();
                $( '#' + certPrefix + '_' + fileType + '_remove' ).show();
            }
            else
            {
                $( '#' + certPrefix + '_' + fileType + '_down' ).hide();
                $( '#' + certPrefix + '_' + fileType + '_remove' ).hide();
            }
        } );
    }

    function bind_certificate_ui_logic()
    {
        var certTypes = [
            { id: 'ca', cmd: 'clear_ca', ext: 'ca', api: 'import_ca' },
            { id: 'crt', cmd: 'clear_cert', ext: 'crt', api: 'import_cert' },
            { id: 'key', cmd: 'clear_key', ext: 'key', api: 'import_key' },
            { id: 'p12', cmd: 'clear_pkcs12', ext: 'p12', api: 'import_pkcs12' },
            { id: 'tlsauth', cmd: 'clear_tlsauth', ext: 'tlsauth', api: 'import_tlsauth' },
            { id: 'dh', cmd: 'clear_dh', ext: 'dh', api: 'import_dh' },
            { id: 'static', cmd: 'clear_static', ext: 'static', api: 'import_static' }
        ];

        certTypes.forEach( function ( cert ) {
            var selector = '#' + certPrefix + '_' + cert.id;
            var filename = 'server.' + cert.ext;

            $( selector ).ace_file_input( {
                no_file: $.i18n( 'No File' ),
                btn_choose: $.i18n( 'Choose' ),
                btn_change: $.i18n( 'Change' ),
                icon_remove: ''
            } );

            $( selector ).fileupload( {
                url: '/upload?username=' + window.username +
                     '&key=' + window.talkkey +
                     '&object=' + encodeURIComponent( object ) +
                     '&api=' + cert.api +
                     '&p=[]',
                paramName: 'filename',
                dataType: 'text',
                add: function ( e, data ) {
                    data.submit();
                },
                done: function () {
                    $( '#' + certPrefix + '_' + cert.id + '_down' ).show();
                    $( '#' + certPrefix + '_' + cert.id + '_remove' ).show();
                }
            } );

            $( selector + '_remove' ).off( ace.click_event ).on( ace.click_event, function () {
                he.exec( [ object + '.' + cert.cmd ] ).then( function () {
                    $( '#' + certPrefix + '_' + cert.id + '_down' ).hide();
                    $( '#' + certPrefix + '_' + cert.id + '_remove' ).hide();
                } );
            } );

            $( selector + '_down' ).off( ace.click_event ).on( ace.click_event, function () {
                var opt;
                var sform = document.createElement( 'FORM' );
                document.body.appendChild( sform );
                sform.hidden = true;
                opt = document.createElement( 'input' ); opt.type = 'hidden'; opt.name = 'username'; opt.value = window.username; sform.appendChild( opt );
                opt = document.createElement( 'input' ); opt.type = 'hidden'; opt.name = 'key'; opt.value = window.talkkey; sform.appendChild( opt );
                opt = document.createElement( 'input' ); opt.type = 'hidden'; opt.name = 'object'; opt.value = object; sform.appendChild( opt );
                opt = document.createElement( 'input' ); opt.type = 'hidden'; opt.name = 'api'; opt.value = 'key'; sform.appendChild( opt );
                opt = document.createElement( 'input' ); opt.type = 'hidden'; opt.name = 'a'; opt.value = cert.id; sform.appendChild( opt );
                opt = document.createElement( 'input' ); opt.type = 'hidden'; opt.name = 'f'; opt.value = filename; sform.appendChild( opt );
                sform.method = 'GET';
                sform.action = '/download';
                sform.submit();
            } );
        } );
    }

    function fill_form( cfg )
    {
        cfg = cfg || {};
        cfg.radius = cfg.radius || {};
        cfg.pkcs12 = cfg.pkcs12 || {};
        $( '#status' ).prop( 'checked', able2boole( cfg.status ) );
        select_or_keep( '#proto', cfg.proto, 'udp' );
        $( '#port' ).val( cfg.port || '1194' );
        select_or_keep( '#dev', cfg.dev, 'tun' );
        select_or_keep( '#topology', cfg.topology, 'subnet' );
        $( '#tunnelip' ).val( cfg.tunnelip || '' );
        $( '#tunnelmask' ).val( cfg.tunnelmask || '' );
        $( '#poolstart' ).val( cfg.poolstart || '' );
        $( '#poolend' ).val( cfg.poolend || '' );
        fill_cipher_box( cfg );
        select_or_keep( '#authdigest', cfg.authdigest, 'SHA256' );
        select_or_keep( '#auth', cfg.auth, 'certificate' );
        $( '#radius_status' ).prop( 'checked', able2boole( cfg.radius.status ) );
        $( '#radius_host' ).val( cfg.radius.host || '' );
        $( '#radius_secret' ).val( cfg.radius.secret || '' );
        $( '#radius_port' ).val( cfg.radius.port || '1812' );
        $( '#radius_wait' ).val( cfg.radius.wait || '5' );
        $( '#radius_accounting' ).prop( 'checked', able2boole( cfg.radius.accounting ) );
        $( '#radius_acctport' ).val( cfg.radius.acctport || '1813' );
        select_or_keep( '#hmac', cfg.hmac, 'disable' );
        $( '#pkcs12_status' ).prop( 'checked', able2boole( cfg.pkcs12.status ) );
        $( '#pkcs12_password' ).val( cfg.pkcs12.password || '' );
        $( '#client2client' ).prop( 'checked', able2boole( cfg.client2client ) );
        $( '#clientdup' ).prop( 'checked', able2boole( cfg.clientdup ) );
        $( '#float' ).prop( 'checked', cfg.float !== 'disable' );
        select_or_keep( '#lzo', cfg.lzo, 'disable' );
        $( '#listonly' ).prop( 'checked', able2boole( cfg.listonly ) );
        $( '#redirect' ).prop( 'checked', able2boole( cfg.redirect ) );
        $( '#dns' ).val( cfg.dns || '' );
        $( '#dns2' ).val( cfg.dns2 || '' );
        $( '#interval' ).val( cfg.interval || '10' );
        $( '#timeout' ).val( cfg.timeout || '120' );
        $( '#maxclient' ).val( cfg.maxclient || '50' );
        $( '#options' ).val( cfg.options || '' );
        fill_net_rules( '#local_net_container', cfg.local_net );
        fill_revoke_rules( cfg.revoke );
        sync_mode_ui();
        $( '#status' ).unbind( 'change' ).change( function () {
            if ( $( this ).prop( 'checked' ) )
            {
                $( '#statusSets' ).show();
            }
            else
            {
                $( '#statusSets' ).hide();
            }
        } ).trigger( 'change' );
    }

    function snapshot_cfg( cfg )
    {
        return JSON.parse( JSON.stringify( cfg || {} ) );
    }

    function collect_cfg_from_form()
    {
        var next = {};
        var picked = [];
        next.status = $( '#status' ).prop( 'checked' ) ? 'enable' : 'disable';
        next.extern = $( '#extern' ).val() || 'disable';
        next.proto = $( '#proto' ).val();
        next.port = $( '#port' ).val().trim() || '1194';
        next.dev = $( '#dev' ).val();
        next.topology = $( '#topology' ).val();
        next.tunnelip = $( '#tunnelip' ).val().trim();
        next.tunnelmask = $( '#tunnelmask' ).val().trim();
        next.poolstart = $( '#poolstart' ).val().trim();
        next.poolend = $( '#poolend' ).val().trim();
        next.bridge = $( '#bridge' ).val() || '';
        $( '#cipher_box input:checked' ).each( function () { picked.push( $( this ).val() ); } );
        next.cipher = picked.join( ':' );
        next.authdigest = $( '#authdigest' ).val();
        next.auth = $( '#auth' ).val();
        next.radius = {
            status: $( '#radius_status' ).prop( 'checked' ) ? 'enable' : 'disable',
            host: $( '#radius_host' ).val().trim(),
            secret: $( '#radius_secret' ).val(),
            port: $( '#radius_port' ).val().trim() || '1812',
            wait: $( '#radius_wait' ).val().trim() || '5',
            accounting: $( '#radius_accounting' ).prop( 'checked' ) ? 'enable' : 'disable',
            acctport: $( '#radius_acctport' ).val().trim() || '1813'
        };
        next.hmac = $( '#hmac' ).val();
        next.pkcs12 = {
            status: $( '#pkcs12_status' ).prop( 'checked' ) ? 'enable' : 'disable',
            password: $( '#pkcs12_password' ).val() || ''
        };
        next.client2client = $( '#client2client' ).prop( 'checked' ) ? 'enable' : 'disable';
        next.clientdup = $( '#clientdup' ).prop( 'checked' ) ? 'enable' : 'disable';
        next.float = $( '#float' ).prop( 'checked' ) ? 'enable' : 'disable';
        next.lzo = $( '#lzo' ).val();
        next.listonly = $( '#listonly' ).prop( 'checked' ) ? 'enable' : 'disable';
        next.redirect = $( '#redirect' ).prop( 'checked' ) ? 'enable' : 'disable';
        next.dns = $( '#dns' ).val().trim();
        next.dns2 = $( '#dns2' ).val().trim();
        next.interval = $( '#interval' ).val().trim() || '10';
        next.timeout = $( '#timeout' ).val().trim() || '120';
        next.maxclient = $( '#maxclient' ).val().trim() || '50';
        next.options = $( '#options' ).val().trim();
        next.local_net = read_net_rules( '#local_net_container' );
        next.revoke = read_revoke_rules();
        return next;
    }

    function load_config()
    {
        he.load( [ object ] ).then( function ( a ) {
            var cfg = a[0] || {};
            return he.load( [
                'network@frame.list[extern]',
                'network@frame.list[local]',
                object + '.key'
            ] ).then( function ( n ) {
                return {
                    cfg: cfg,
                    iflist: n[0] || {},
                    bridges: n[1] || {},
                    key: n[2] || {}
                };
            }, function () {
                return { cfg: cfg, iflist: {}, bridges: {}, key: {} };
            } );
        } ).then( function ( pack ) {
            build_extern_select( pack.cfg, pack.iflist );
            build_bridge_select( pack.cfg, pack.bridges );
            fill_form( pack.cfg );
            key_load( pack.key );
            lastCfgSnapshot = snapshot_cfg( pack.cfg );
            client_cfg_load().then( function () {
                client_status_load();
            } );
        } );
    }

    function save_config()
    {
        var new_cfg = collect_cfg_from_form();
        var copy = lastCfgSnapshot ? snapshot_cfg( lastCfgSnapshot ) : {};
        if ( ocompare( new_cfg, copy ) )
        {
            page.alert( { message: $.i18n( 'Settings unchanged' ) } );
            return;
        }
        he.exec( [ object + '=' + JSON.stringify( new_cfg ) ] ).then( function () {
            page.hint2succeed( $.i18n( 'Save successfully' ) );
            load_config();
        } );
    }

    $( document ).on( 'click', '.ovpns_net_del', function () {
        var box = $( this ).closest( '[id$=_container]' );
        var id = '#' + box.attr( 'id' );
        $( this ).closest( '.route-rule-item' ).remove();
        if ( $( id + ' .route-rule-item' ).length === 0 )
        {
            add_net_rule( id, '', '' );
        }
        else
        {
            refresh_net_buttons( id );
        }
    } );
    $( document ).on( 'click', '.ovpns_net_add', function () {
        var id = '#' + $( this ).closest( '[id$=_container]' ).attr( 'id' );
        add_net_rule( id, '', '' );
    } );
    $( document ).on( 'click', '.ovpns_rev_del', function () {
        $( this ).closest( '.route-rule-item' ).remove();
        if ( $( '#revoke_container .route-rule-item' ).length === 0 )
        {
            add_revoke_rule( '', '' );
        }
        else
        {
            refresh_revoke_buttons();
        }
    } );
    $( document ).on( 'click', '.ovpns_rev_add', function () {
        add_revoke_rule( '', '' );
    } );

    page.password( 'radius_secret', 'radius_secret-icon' );
    page.password( 'pkcs12_password', 'pkcs12_password-icon' );

    $.i18n().load( page.lang( langjson ) ).then( function () {
        $.i18n().locale = lang;
        $( 'body' ).i18n();
        bind_certificate_ui_logic();
        init_client_table();
        init_online_table();
        $( '#auth, #dev, #hmac, #pkcs12_status, #radius_status' ).on( 'change', sync_mode_ui );
        $( document ).on( 'change', '#cipher_box input', sync_mode_ui );
        $( '#ovpns_tabs a[data-toggle="tab"]' ).on( 'shown.bs.tab', function ( e ) {
            var href = $( e.target ).attr( 'href' );
            if ( href === '#tab-client' )
            {
                client_set_width();
            }
            else if ( href === '#tab-online' )
            {
                online_set_width();
                client_status_load();
            }
        } );
        load_config();
        client_start_timer();
        $( '#refresh' ).on( ace.click_event, function () {
            location.reload();
        } );
        $( '#apply' ).on( ace.click_event, function () {
            save_config();
        } );
    } );
})();

function config_ovpns_client( fullpath )
{
    var app_hash;
    if ( !fullpath )
    {
        return;
    }
    app_hash = '#app?page=' + base64.encode( ovpns_prjpath + '/client.html' );
    app_hash += '&path=' + encodeURIComponent( fullpath );
    app_hash += '&lang=' + base64.encode( ovpns_prjlang );
    $( location ).attr( 'href', app_hash );
}

</script>
