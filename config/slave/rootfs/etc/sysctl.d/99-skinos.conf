# Raise socket recv/send cap so nport/heport can setsockopt large SO_RCVBUF/SO_SNDBUF.
# Applied by systemd-sysctl at boot (root). setup.sh is not root.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
# AF_UNIX SOCK_DGRAM full = packet count, not rmem. Default 512; 64KB HH bursts EAGAIN at ~1000.
net.unix.max_dgram_qlen = 4096
