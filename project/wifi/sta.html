<!-- page specific plugin scripts -->
<script type="text/javascript">
  var sta;
  var state;
  var securelist;
  var object = "wifi@xsta";
  var currentActiveRow = 1;
  var apDataStore = {};
  var index = page.param( 'object', location.hash );
  if ( index )
  {
      object = index;
  }
  var langjson = base64.decode( page.param( 'lang', location.hash ) );

  function status_load()
  {
    he.bkload( [ object+".status" ] ).then( function(v){
      var info = v[0];
      state = info;
      if ( !info )
      {
          return;
      }
      if ( info.status )
      {
          $("#status_status").text( $.i18n(info.status) );
          if ( info.status == "up" || info.status == "uping" || info.status == "connect" ||
               info.status == "connecting" || info.status == "block" || info.status == "failed" )
          {
              $("#status_btn").html( '<i class="ace-icon fa fa-pause"></i>' );
          }
          else
          {
              $("#status_btn").html( '<i class="ace-icon fa fa-play"></i>' );
          }
          if ( info.error )
          {
              $("#status_status").text( $.i18n(info.error) );
          }
      }
      else
      {
          $("#status_btn").html( '<i class="ace-icon fa fa-play"></i>' );
          $("#status_status").text( $.i18n("down") );
      }
      if ( info.rate )
      {
          $("#status_rate").text( info.rate+'Mbps' );
      }
      $("#status_peer").text( info.peer||' ' );
      $("#status_peermac").text( info.peermac||' ' );
      $("#status_channel").text( info.channel||' ' );
      if ( info.sig )
      {
          $("#status_rssi").text( info.sig+"%" );
      }
      else if ( info.rssi )
      {
          $("#status_rssi").text( info.rssi+"dBm" );
      }
      if ( info.signal )
      {
          $("#status_rssiimg").attr( "src", "/assets/css/images/signal_"+info.signal+".png" );
      }
      $("#status_mac").text( info.mac||' ' );
      $("#status_rxtx").text( byte2readable( (info.rx_bytes||"0") ) + " / " + byte2readable( (info.tx_bytes||"0") ) );
    });
  }

  function cfg_load()
  {
    he.load( [ object, object+'.securelist' ] ).then( function(v){
      sta = v[0];
      securelist = v[1];

      if ( sta )
      {
          if ( sta.status )
          {
              $('#status').prop( 'checked', able2boole(sta.status) );
          }
          else if ( sta.peer || sta.peermac )
          {
              $('#status').prop( 'checked', true );
          }
          else
          {
              $('#status').prop( 'checked', false );
          }

          $('#peer').val( sta.peer || '' );
          $('#peer2').val( sta.peer2 || '' );
          $('#peer3').val( sta.peer3 || '' );
          $('#wpa_key').val( sta.wpa_key || '' );
          $('#wpa_key2').val( sta.wpa_key2 || '' );
          $('#wpa_key3').val( sta.wpa_key3 || '' );
          $('#nossid').prop( 'checked', sta.nossid=="enable" );
          $('#hidden').prop( 'checked', sta.peermode=="hidden" );
          $('#hidden2').prop( 'checked', sta.peermode2=="hidden" );
          $('#hidden3').prop( 'checked', sta.peermode3=="hidden" );

          [ '', '2', '3' ].forEach( function( s ) {
              var macValue = sta['peermac' + s] || '';
              var $macInput = $('#peermac' + s);
              $macInput.val( macValue ).data( 'backup-mac', macValue );
              $('#lock' + s).prop( 'checked', !!macValue ).trigger( 'change' );
          } );
      }
      else
      {
          $('#status').prop( 'checked', false );
      }

      $('#status').trigger('change');

      /* WIFI STA secure options — same as wisp.js */
      if ( securelist )
      {
          $("#secure").empty();
          for ( m in securelist )
          {
              $("#secure").append( "<option value='"+m+"'>" + $.i18n(m) + "</option>" );
          }
          $('#secure').val( (sta && sta.secure) || 'disable' );
          $('#secure').unbind('change').change(function (e) {
              var secure = e.target.value;
              if ( secure == "disable" )
              {
                  $("#secure_cfg").hide();
                  $("#secure_cfg2").hide();
              }
              else
              {
                  $("#wpa_encrypt").empty();
                  $("#secure_cfg").show();
                  $("#secure_cfg2").show();
                  if ( securelist[secure] )
                  {
                      for ( b in securelist[secure] )
                      {
                          $("#wpa_encrypt").append( "<option value='"+b+"'>" + $.i18n(b) + "</option>" );
                      }
                  }
                  $('#wpa_encrypt').val( (sta && sta.wpa_encrypt) || 'aes' );
              }
          }).trigger('change');
      }
      else
      {
          $('#secure').val( (sta && sta.secure) || 'disable' );
          $('#wpa_encrypt').val( (sta && sta.wpa_encrypt) || 'aes' );
          $('#secure').unbind('change').change(function (e) {
              var secure = e.target.value;
              if ( secure == 'disable' )
              {
                  $('#secure_cfg').hide();
                  $('#secure_cfg2').hide();
              }
              else
              {
                  $('#secure_cfg').show();
                  $('#secure_cfg2').show();
              }
          }).trigger('change');
      }

      if ( securelist )
      {
          $("#secure2").empty();
          for ( m in securelist )
          {
              $("#secure2").append( "<option value='"+m+"'>" + $.i18n(m) + "</option>" );
          }
          $('#secure2').val( (sta && sta.secure2) || 'disable' );
          $('#secure2').unbind('change').change(function (e) {
              var secure = e.target.value;
              if ( secure == "disable" )
              {
                  $("#secure2_cfg").hide();
                  $("#secure2_cfg2").hide();
              }
              else
              {
                  $("#wpa_encrypt2").empty();
                  $("#secure2_cfg").show();
                  $("#secure2_cfg2").show();
                  if ( securelist[secure] )
                  {
                      for ( b in securelist[secure] )
                      {
                          $("#wpa_encrypt2").append( "<option value='"+b+"'>" + $.i18n(b) + "</option>" );
                      }
                  }
                  $('#wpa_encrypt2').val( (sta && sta.wpa_encrypt2) || 'aes' );
              }
          }).trigger('change');
      }
      else
      {
          $('#secure2').val( (sta && sta.secure2) || 'disable' );
          $('#wpa_encrypt2').val( (sta && sta.wpa_encrypt2) || 'aes' );
          $('#secure2').unbind('change').change(function (e) {
              var secure = e.target.value;
              if ( secure == 'disable' )
              {
                  $('#secure2_cfg').hide();
                  $('#secure2_cfg2').hide();
              }
              else
              {
                  $('#secure2_cfg').show();
                  $('#secure2_cfg2').show();
              }
          }).trigger('change');
      }

      if ( securelist )
      {
          $("#secure3").empty();
          for ( m in securelist )
          {
              $("#secure3").append( "<option value='"+m+"'>" + $.i18n(m) + "</option>" );
          }
          $('#secure3').val( (sta && sta.secure3) || 'disable' );
          $('#secure3').unbind('change').change(function (e) {
              var secure = e.target.value;
              if ( secure == "disable" )
              {
                  $("#secure3_cfg").hide();
                  $("#secure3_cfg2").hide();
              }
              else
              {
                  $("#wpa_encrypt3").empty();
                  $("#secure3_cfg").show();
                  $("#secure3_cfg2").show();
                  if ( securelist[secure] )
                  {
                      for ( b in securelist[secure] )
                      {
                          $("#wpa_encrypt3").append( "<option value='"+b+"'>" + $.i18n(b) + "</option>" );
                      }
                  }
                  $('#wpa_encrypt3').val( (sta && sta.wpa_encrypt3) || 'aes' );
              }
          }).trigger('change');
      }
      else
      {
          $('#secure3').val( (sta && sta.secure3) || 'disable' );
          $('#wpa_encrypt3').val( (sta && sta.wpa_encrypt3) || 'aes' );
          $('#secure3').unbind('change').change(function (e) {
              var secure = e.target.value;
              if ( secure == 'disable' )
              {
                  $('#secure3_cfg').hide();
                  $('#secure3_cfg2').hide();
              }
              else
              {
                  $('#secure3_cfg').show();
                  $('#secure3_cfg2').show();
              }
          }).trigger('change');
      }
    });
  }

  function cfg_save()
  {
    var cmds = [];
    var stacopy;

    if ( sta == null )
    {
      sta = {};
    }
    stacopy = JSON.parse(JSON.stringify(sta));
    sta.status = boole2able( $('#status').prop('checked') );

    /* peer / scan fields — same as wisp.js (always save, not only when enabled) */
    sta.peer = $('#peer').val();
    sta.peer2 = $('#peer2').val();
    sta.peer3 = $('#peer3').val();
    sta.peermac = '';
    sta.peermac2 = '';
    sta.peermac3 = '';
    if ( $('#lock').prop('checked') )
    {
      sta.peermac = $('#peermac').val();
      if ( check.mac( sta.peermac, true ) == false )
      {
          page.alert( {
              message: $.i18n('Peer BSSID')+" "+$.i18n('must be a valid MAC address'),
              callback: function()
              {
                  $('#peermac').select();
              }
          } );
          return;
      }
    }
    if ( $('#lock2').prop('checked') )
    {
      sta.peermac2 = $('#peermac2').val();
      if ( check.mac( sta.peermac2, true ) == false )
      {
          page.alert( {
              message: $.i18n('Peer BSSID')+" "+$.i18n('must be a valid MAC address'),
              callback: function()
              {
                  $('#peermac2').select();
              }
          } );
          return;
      }
    }
    if ( $('#lock3').prop('checked') )
    {
      sta.peermac3 = $('#peermac3').val();
      if ( check.mac( sta.peermac3, true ) == false )
      {
          page.alert( {
              message: $.i18n('Peer BSSID')+" "+$.i18n('must be a valid MAC address'),
              callback: function()
              {
                  $('#peermac3').select();
              }
          } );
          return;
      }
    }

    sta.secure = $('#secure').val();
    if ( sta.secure != 'disable' )
    {
        sta.wpa_encrypt = $('#wpa_encrypt').val()||"aes";
        sta.wpa_key = $('#wpa_key').val();
        if ( !sta.wpa_key )
        {
            page.alert( { message: $.i18n('Password')+" "+$.i18n('Can not be empty') } );
            return;
        }
    }
    sta.secure2 = $('#secure2').val();
    if ( sta.secure2 != 'disable' )
    {
        sta.wpa_encrypt2 = $('#wpa_encrypt2').val()||"aes";
        sta.wpa_key2 = $('#wpa_key2').val();
        if ( !sta.wpa_key2 )
        {
            page.alert( { message: $.i18n('Password')+" "+$.i18n('Can not be empty') } );
            return;
        }
    }
    sta.secure3 = $('#secure3').val();
    if ( sta.secure3 != 'disable' )
    {
        sta.wpa_encrypt3 = $('#wpa_encrypt3').val()||"aes";
        sta.wpa_key3 = $('#wpa_key3').val();
        if ( !sta.wpa_key3 )
        {
            page.alert( { message: $.i18n('Password')+" "+$.i18n('Can not be empty') } );
            return;
        }
    }

    sta.nossid = boole2able( $('#nossid').prop('checked') );
    delete sta.peermode;
    delete sta.peermode2;
    delete sta.peermode3;
    delete sta.strong;
    delete sta.channel;
    if ( $('#hidden').prop('checked') )
    {
        sta.peermode = "hidden";
    }
    if ( $('#hidden2').prop('checked') )
    {
        sta.peermode2 = "hidden";
    }
    if ( $('#hidden3').prop('checked') )
    {
        sta.peermode3 = "hidden";
    }

    if ( !ocompare( sta, stacopy ) )
    {
      cmds.push( object+"="+JSON.stringify(sta) );
    }
    if ( cmds.length == 0 )
    {
        page.alert( { message: $.i18n('Settings unchanged') } );
        return;
    }
    page.confirm( { message: $.i18n('The wireless client will be disconneted because of the change of configuration') } ).then( function(result){
      if (!result) return location.reload();
      if ( result )
      {
          he.exec( cmds ).then( function(){
              page.hint2succeed( $.i18n('Modified successfully') );
              cfg_load();
          });
      }
    });
  }

  /* init */
  page.password('wpa_key', 'wpa_key-icon' );
  page.password('wpa_key2', 'wpa_key2-icon' );
  page.password('wpa_key3', 'wpa_key3-icon' );
  $.i18n().load( page.lang(langjson) ).then( function () {
      $.i18n().locale = lang; $('body').i18n();

      jqtable.create( '#aplist-grid-table', '#aplist-grid-pager',
          {
              multiselect: false,
              caption: $.i18n('AP List'),
              toolbar: [true, "top"],
              colNames: [ $.i18n('Choose'), $.i18n('SSID'), $.i18n('Channel'), $.i18n('Signal'), $.i18n('MAC'), $.i18n('Security Mode'), $.i18n('WPA Mode') ],
              colModel:
              [
                  {
                      name: 'choose', width: 80,
                      fixed: true, sortable: false,
                      formatter: function ( cellvalue, options, rowObject )
                      {
                          return '<button class="btn btn-main btn-xs btn-choose" onclick="sta_ap_select(' + options.rowId + ')" data-id="' + options.rowId + '">' + $.i18n('Choose') + '</button>'
                      }
                  },
                  { name: 'ssid', width: 180 },
                  { name: 'channel', width: 70 },
                  {
                      name: 'signal', width: 70,
                      formatter: function ( cellvalue, options, rowObject )
                      {
                          if ( cellvalue > 0 )
                          {
                              return "<img src='/assets/css/images/signal_"+cellvalue+".png' class='line-signal'></img>";
                          }
                          else
                          {
                              return "<img src='/assets/css/images/signal_0.png' class='line-signal'></img>";
                          }
                      }
                  },
                  { name: 'mac', width: 160 },
                  {
                      name: 'secure', width: 190,
                      formatter: function ( cellvalue )
                      {
                          var safeValue = cellvalue;
                          var displayText;
                          if (!safeValue || typeof safeValue === 'object')
                          {
                              safeValue = "";
                          }
                          if ( safeValue === "" )
                          {
                              displayText = "";
                          }
                          else
                          {
                              displayText = $.i18n(safeValue);
                          }
                          return '<span data-secure="' + safeValue + '">' + displayText + '</span>';
                      },
                      unformat: function (cellvalue, options, cell)
                      {
                          return $(cell).children('span').data('secure');
                      }
                  },
                  {
                      name: 'wpa_encrypt', width: 100,
                      formatter: function (cellvalue, options, rowObject)
                      {
                          var secureMode = rowObject.secure || '';
                          var safeValue = cellvalue;
                          var displayText;
                          if (secureMode === 'disable' || !safeValue || typeof safeValue === 'object')
                          {
                              safeValue = "";
                          }
                          if ( safeValue === "" )
                          {
                              displayText = "";
                          }
                          else
                          {
                              displayText = $.i18n(safeValue);
                          }
                          return '<span data-wpa_encrypt="' + safeValue + '">' + displayText + '</span>';
                      },
                      unformat: function (cellvalue, options, cell)
                      {
                          return $(cell).children('span').data('wpa_encrypt');
                      }
                  }
              ],
              pager: '#aplist-grid-pager',
              rowNum: 20,
              viewrecords: true,
              pgbuttons: true,
              pagerpos:'center',
              pginput:true,
          }
      ).jqGrid(
            'navGrid', '#aplist-grid-pager',
            $.extend(true, {}, jqtable.navOptions, { add: false, edit: false, search: false, refresh: false, del: false, view: false } ),
            {},{},{}
      );

      var $toolbar = $("#t_" + "aplist-grid-table");
      $toolbar.append($('#grid-controls').children());
      $toolbar.css({
          'display': 'flex',
          'justify-content': 'space-between',
          'align-items': 'center',
          'background': '#f5f5f5',
          'padding': '8px 10px',
          'height': 'auto',
      });

      $('#rowNums').on('change',function(){
          var newRowNum = parseInt($(this).val(),10);
          $('#aplist-grid-table').jqGrid('setGridParam',{rowNum:newRowNum}).trigger('reloadGrid')
      });

      status_load();
      cfg_load();

      $('#status').unbind('change').change(function () {
          if ( $(this).prop('checked') )
          {
              $('#sta_config').show();
          }
          else
          {
              $('#sta_config').hide();
          }
      });

      $('#lock, #lock2, #lock3').on('change', function() {
          var suffix = this.id.replace('lock', '');
          var $macInput = $('#peermac' + suffix);
          if ($(this).prop('checked')) {
              var backup = $macInput.data('backup-mac') || '';
              if (backup) {
                  $macInput.val(backup);
              }
          }
      });

      $('#status_btn').on(ace.click_event, function () {
          if ( state && ( state.status == "up" || state.status == "uping" || state.status == "connect" ||
               state.status == "connecting" || state.status == "block" || state.status == "failed" ) )
          {
              he.exec( [ object+'.down' ] ).then( function(result){status_load();} );
          }
          else
          {
              he.exec( [ object+'.up' ] ).then( function(result){status_load();} );
          }
      });

      page.timing({
        refresh: function ()
        {
            status_load();
        },
        interval: 3000
      });

      /* scanning — same as wisp.js */
      $('.apscan-btn').unbind(ace.click_event).on(ace.click_event, function () {
          currentActiveRow = $(this).data('row-index');
          he.exec( [ object+'.aplist' ], $.i18n("Scanning") ).then( function(v){
              var list = v[0];
              var rows = json2array( list, {}, "mac" );
              var mac;
              var ap;

              apDataStore = {};
              if ( Array.isArray(list) )
              {
                  list.forEach(function(item) {
                      if ( item && item.mac )
                      {
                          apDataStore[item.mac] = {
                              secure: item.secure || '',
                              wpa_encrypt: item.wpa_encrypt || '',
                          };
                      }
                  });
              }
              else if ( list )
              {
                  for ( mac in list )
                  {
                      ap = list[mac];
                      if ( ap && typeof ap === 'object' )
                      {
                          apDataStore[mac] = {
                              secure: ap.secure || '',
                              wpa_encrypt: ap.wpa_encrypt || '',
                          };
                      }
                  }
              }

              $('#aplist-grid-table').jqGrid('clearGridData').jqGrid('setGridParam', {
                  data: rows
              }).trigger('reloadGrid');
              $('#aplist-modal').modal('show');
          });
      });

      $('#rescan').unbind(ace.click_event).on(ace.click_event, function () {
          he.exec( [ object+'.aplist' ], $.i18n("Scanning") ).then( function(v){
              var list = v[0];
              var rows = json2array( list, {}, "mac" );
              var mac;
              var ap;

              apDataStore = {};
              if ( Array.isArray(list) )
              {
                  list.forEach(function(item) {
                      if ( item && item.mac )
                      {
                          apDataStore[item.mac] = {
                              secure: item.secure || '',
                              wpa_encrypt: item.wpa_encrypt || '',
                          };
                      }
                  });
              }
              else if ( list )
              {
                  for ( mac in list )
                  {
                      ap = list[mac];
                      if ( ap && typeof ap === 'object' )
                      {
                          apDataStore[mac] = {
                              secure: ap.secure || '',
                              wpa_encrypt: ap.wpa_encrypt || '',
                          };
                      }
                  }
              }

              $('#aplist-grid-table').jqGrid('clearGridData').jqGrid('setGridParam', {
                  data: rows
              }).trigger('reloadGrid');
              $('#aplist-modal').modal('show');
          });
      });

      $('#refresh').on(ace.click_event, function () {
          location.reload();
      });
      $('#apply').on(ace.click_event, function () {
          cfg_save();
      });
  });

  /* must be global for jqGrid choose button */
  function sta_ap_select( rowId )
  {
      var ap;
      var mac;
      var originalData;
      var suffix;
      var rawSecure;
      var targetSecure;
      var wpaEncryptValue;
      var cleanValue;
      var finalValue;
      var $targetEl;
      var $option;
      var fallback;
      var $macInput;

      $('#aplist-modal').modal('hide');

      ap = $('#aplist-grid-table').jqGrid('getRowData', rowId);
      mac = ap.mac;
      originalData = apDataStore[mac];
      if ( currentActiveRow === 1 )
      {
          suffix = '';
      }
      else
      {
          suffix = currentActiveRow;
      }

      $('#peer' + suffix).val(ap.ssid);
      $macInput = $('#peermac' + suffix);
      $macInput.val(mac).data('backup-mac', mac);
      $('#lock' + suffix).prop('checked', false).trigger('change');

      rawSecure = ap.secure || 'disable';
      targetSecure = 'disable';
      if ( $("#secure" + suffix + " option[value='" + rawSecure + "']").length > 0 )
      {
          targetSecure = rawSecure;
      }
      else if ( rawSecure.indexOf('wpa3psk') !== -1 || rawSecure.indexOf('wpa2pskwpa3psk') !== -1 )
      {
          if ( $("#secure" + suffix + " option[value='wpa2pskwpa3psk']").length > 0 )
          {
              targetSecure = 'wpa2pskwpa3psk';
          }
          else if ( $("#secure" + suffix + " option[value='wpa2psk']").length > 0 )
          {
              targetSecure = 'wpa2psk';
          }
          else if ( $("#secure" + suffix + " option[value='wpapsk']").length > 0 )
          {
              targetSecure = 'wpapsk';
          }
      }
      else if ( rawSecure.indexOf('wpa2psk') !== -1 || rawSecure.indexOf('wpapskwpa2psk') !== -1 )
      {
          if ( $("#secure" + suffix + " option[value='wpapskwpa2psk']").length > 0 )
          {
              targetSecure = 'wpapskwpa2psk';
          }
          else if ( $("#secure" + suffix + " option[value='wpa2psk']").length > 0 )
          {
              targetSecure = 'wpa2psk';
          }
          else if ( $("#secure" + suffix + " option[value='wpapsk']").length > 0 )
          {
              targetSecure = 'wpapsk';
          }
      }
      $('#secure' + suffix).val(targetSecure).trigger('change');

      if ( originalData )
      {
          wpaEncryptValue = originalData.wpa_encrypt;
      }
      else
      {
          wpaEncryptValue = ap.wpa_encrypt;
      }
      cleanValue = (wpaEncryptValue || '').toString().trim().toLowerCase();
      finalValue = 'tkipaes';
      if ( cleanValue === 'tkip' )
      {
          finalValue = 'tkip';
      }
      else if ( cleanValue === 'aes' )
      {
          finalValue = 'aes';
      }
      else if ( cleanValue === 'tkipaes' )
      {
          finalValue = 'tkipaes';
      }

      setTimeout(function() {
          $targetEl = $('#wpa_encrypt' + suffix);
          $option = $targetEl.find('option[value="' + finalValue + '"]');
          if ( $option.length > 0 )
          {
              $targetEl.val(finalValue).trigger('change');
          }
          else
          {
              if ( $targetEl.find('option[value="tkipaes"]').length > 0 )
              {
                  fallback = 'tkipaes';
              }
              else
              {
                  fallback = $targetEl.find('option:first').val();
              }
              $targetEl.val(fallback).trigger('change');
          }
      }, 50);

      $('#hidden' + suffix).prop('checked', false).trigger('change');
  }
</script>
