<!-- page specific plugin scripts -->
<script type="text/javascript">
  window.wifi_client = window.wifi_client || {
    timer: null,
    currentObject: null
  };
  var knock_object = null;

  (function () {
    /* get the object */
    var ssid;
    var radio;
    var acs;
    var chlist;
    var modelist;
    var powerlist;
    var securelist;
    var object = "wifi@x";
    var index = page.param( 'object', location.hash );
    if ( index )
    {
        object = index;
    }
    var langjson = base64.decode( page.param( 'lang', location.hash ) );
    var robj = object;
    var sobj = object+"ssid";

    // about clients
    var timer;
    var stalist;
    var clients;
    var inputFocused = false;
    knock_object = object;
    var clients_table = '#clients-grid-table-wifi';
    var clients_pager = '#clients-grid-pager-wifi';

    if (window.wifi_client.timer) {
        clearInterval(window.wifi_client.timer);
        window.wifi_client.timer = null;
    }
    // 记录当前页面正在操作的对象
    window.wifi_client.currentObject = object;

    // about acl
    var ssidcopy;
    var stalist;
    var clientlist;
    // 使用拼接的sobj

    // 统一tab解决定时器刷新两个表格的问题
    var activeWifiTab = '#tab-ssid';
    var aclLoading = false;
    var clientsLoading = false;

    // 标签页状态保存
    var wifiTabStorageKey = 'wifi_active_tab';
    /* load the configure on the input */

    function flash_channel( mode, country, channel, acs )
    {
        he.bkload( [ robj+".chlist["+mode+","+country+"]" ] ).then( function(v){

            if ( v[0] )
            {
                $("#channel").empty();
                if ( acs == true )
                {
                    $("#channel").append("<option value='0'>" + $.i18n("Auto") + "</option>");
                }
                for( c in v[0] )
                {
                    $("#channel").append("<option value='"+c+"'>" + c + "</option>");
                }
                if ( channel )
                {
                    $('#channel').val( channel );
                }
            }
        })
    }
    function cfg_load()
    {
      he.load( [ robj, robj+".modelist", robj+".powerlist", robj+".securelist", robj+".acs", sobj ] ).then( function(v){
        radio = v[0];
        modelist = v[1];
        powerlist = v[2];
        securelist = v[3];
        acs = v[4];
        ssid = v[5];

        $("#button_radio").show();

        /* ssid */
        $('#status').prop( 'checked', able2boole(ssid.status) );
        $('#ssid').val( ssid.ssid || '' );
		/* secure mode */
        if ( securelist )
        {
            $("#secure").empty();            
            for( m in securelist )
            {
                $("#secure").append("<option value='"+m+"'>" + $.i18n(m) + "</option>");
            }
            $('#secure').val( ssid.secure || 'disable' );
            $('#secure').unbind('change').change(function (e) {
              var secure = e.target.value;
			  if ( secure == "disable" || secure == "owe" )
			  {
                  $("#secure_cfg").hide();
			  }
			  else
			  {
                  $("#secure_cfg").show();
			      $("#wpa_encrypt").empty();            
	              if ( securelist[secure] )
	              {
	                  for( b in securelist[secure] )
	                  {
	                      $("#wpa_encrypt").append("<option value='"+b+"'>" + $.i18n(b) + "</option>");
	                  }
	              }
				  $('#wpa_encrypt').val( ssid.wpa_encrypt || 'aes' );
			  }
            }).trigger('change');
        }
		else
        {
	        $('#secure').val( ssid.secure || 'disable' );
	        $('#wpa_encrypt').val( ssid.wpa_encrypt || 'tkipaes' );
	        $('#secure').unbind('change').change(function (e) {
	          var secure = e.target.value;
	          if ( secure === 'disable' )
	          {
	            $('#secure_cfg').hide();
	          }
	          else
	          {
	            $('#secure_cfg').show();
	          }
	        }).trigger('change');
		}
        $('#wpa_key').val( ssid.wpa_key || '' );
        $('#hide').prop( 'checked', !able2boole(ssid.broadcast) );
        $('#isolated').prop( 'checked', able2boole(ssid.isolated) );
		/* status */
        $('#status').unbind('change').change(function () {
          if ($(this).prop('checked'))
          {
            $('#ssid_cfg').show();
            var containerWidth = $('#ssid_cfg').parent().width() || $(window).width() - 100;
            if ($('#clients-grid-table-wifi')[0].grid) { 
                $('#clients-grid-table-wifi').jqGrid('setGridWidth', containerWidth);
            }
            if ($('#acl-grid-table')[0].grid) { 
                $('#acl-grid-table').jqGrid('setGridWidth', containerWidth);
            }
          }
          else
          {
            $('#ssid_cfg').hide();
          }
        }).trigger('change');
        /* radio */
        $('#beacon').val( radio.beacon );

    function load_clients(force)
    {
        if (!force && activeWifiTab !== '#tab-clients') {
            return;
        }

        if (!$(clients_table)[0] || !$(clients_table)[0].grid) {
            return;
        }

        if (clientsLoading) {
            return;
        }
        $("#button_radio").show();

        clientsLoading = true;

        he.bkload( [ object+".stalist", 'client@station.list' ] ).then( function(v){
            clientsLoading = false;

            if (window.wifi_client.currentObject !== object) {
                return; 
            }

            if (!force && activeWifiTab !== '#tab-clients') {
                return;
            }

            if (!$(clients_table)[0] || !$(clients_table)[0].grid) {
                return;
            }

            stalist = v[0];
            clients = v[1];
            // 合并
            var count = 0;
            var rows = [];
            for ( var index in stalist )
            {
                var sta = stalist[index];
                var client = clients[index];
                var row = {};
                row[ 'mac'] =  index;
				if ( client )
				{
	                row[ 'name'] = client.name || '';
	                row[ 'ip'] = client.ip || '';
				}
                if ( sta.rx_bytes || sta.tx_bytes )
                {
                    row[ 'rxtx' ] = byte2readable( sta.rx_bytes ) + " / " + byte2readable(sta.tx_bytes);
                }
                else
                {
                	if ( client )
					{
	                    if ( !client.rx_bytes )
	                    {
	                        client.rx_bytes = "0";
	                    }
	                    if ( !client.tx_bytes )
	                    {
	                        client.tx_bytes = "0";
	                    }
	                    row[ 'rxtx' ] = byte2readable( client.rx_bytes ) + " / " + byte2readable(client.tx_bytes);
					}
                }
                if ( sta.rssi )
                {
                    row[ 'rssi'] = sta.rssi+'dBm';
                }
                else
                {
                    row[ 'rssi'] = '';
                }
				if ( sta.livetime )
                {
                    row[ 'livetime'] = time2string(sta.livetime);
                    count++;
                    rows.unshift( row );
				}
				else
                {
                    row[ 'livetime'] = $.i18n('Leave');
                    rows.push( row );
                }
            }
            if (window.wifi_client.currentObject !== object) return;

            // 表头设置为在线客户端的数量
            $(clients_table).jqGrid( "setCaption", $.i18n('Online Number') + ' (' + count + ')' );
            // 记住滚动条的位置
            var scrollPos = jqtable.getScrollPos();
            // 获取当前分页状态
            var currentPage = $(clients_table).jqGrid('getGridParam', 'page');
            var currentRowNum = $(clients_table).jqGrid('getGridParam', 'rowNum');
            
            // 给clients表格设置数据
            $(clients_table).jqGrid('setGridParam', {
                data: rows,
                page: currentPage,
                rowNum: currentRowNum
            }).trigger('reloadGrid');
            // 恢复滚动条的位置
            jqtable.setScrollPos(scrollPos);
            // 改变离线行的颜色
            $('td[title=' + $.i18n('Leave') + ']').closest('tr').css({color: '#888'});
        },function(){
          // 函数回调保护
          clientsLoading = false;
        });
    }

    function startRefreshTimer() {
        stopRefreshTimer();

        activeWifiTab = activeWifiTab || '#tab-ssid';
        /*
        * 只有 ACL 和 Clients 需要定时刷新
        * SSID Setup / Advanced Setup 不启动 timer
        */
        if (activeWifiTab !== '#tab-acl' && activeWifiTab !== '#tab-clients') {
            return;
        }

        window.wifi_client.timer = setInterval(function() {
          /*
          * 2.4G / 5.8G 相同页面切换保护
          * 如果当前 object 已经不是这个页面的 object，停止旧 timer
          */
          if (window.wifi_client.currentObject !== object) {
              stopRefreshTimer();
              return;
          }

          if (activeWifiTab === '#tab-clients') {
              if (!$(clients_table)[0] || !$(clients_table)[0].grid) {
                  return;
              }

              var currentPage = $(clients_table).jqGrid('getGridParam', 'page');

              if (currentPage === 1) {
                  load_clients(false);
              }
          }
      }, 1000);
        
        //console.log('定时器已启动');
    }

    function stopRefreshTimer() {
        if (window.wifi_client.timer) {  
            clearInterval(window.wifi_client.timer);  
            window.wifi_client.timer = null;  
        }  
    }

    /* save the configure */
    function ssid_save()
    {
      var cmds = [];
      var ssidcopy = null;
      var radiocopy = null;

      if ( ssid == null )
      {
        ssid = {};
      }
      ssidcopy = JSON.parse(JSON.stringify(ssid));
      ssid.status = boole2able( $('#status').prop('checked') );

      if ( $('#status_acl').prop('checked') )
      {
          ssid.acl = $('input[name="acl_type"]:checked').val();
          ssid.acl_table = {};
          var rowNum =  $('#acl-grid-table').jqGrid('getGridParam', 'rowNum');                   //获取当前页条数
          var total = $('#acl-grid-table').jqGrid('getGridParam', 'records');                    //获取总数 （包含未显示的数据）
          $('#acl-grid-table').jqGrid('setGridParam', { rowNum: total }).trigger('reloadGrid');  //把grid重新加载成全部数据（前端不会变化）
          var rows =  $('#acl-grid-table').jqGrid('getDataIDs');
          for ( var i = 0; i < rows.length; i++ )
          {
              var row = $('#acl-grid-table').jqGrid('getRowData', rows[i] );
              ssid.acl_table[row.mac] = row.name;
          }
          $('#acl-grid-table').jqGrid('setGridParam', { rowNum: rowNum }).trigger('reloadGrid');  //还原成原先状态        
      }
      else
      {
          ssid.acl = "disable";
      }

      if ( ssid.status )
      {
        ssid.ssid = $('#ssid').val();
        ssid.secure = $('#secure').val();
        if ( ssid.secure != 'disable' && ssid.secure != 'owe' )
        {
          ssid.wpa_encrypt = $('#wpa_encrypt').val()||"aes";
          ssid.wpa_key = $('#wpa_key').val();
        }
        ssid.broadcast = boole2able( ! $('#hide').prop('checked') );
        ssid.isolated = boole2able( $('#isolated').prop('checked') );
      }

      if ( radio == null )
      {
        radio = {};
      }
      var radiocopy = JSON.parse(JSON.stringify(radio));
      if ( $('#mode').val() )
      {
        radio.mode = $('#mode').val()
      }
      if ( $('#bandwidth').val() )
      {
        radio.bandwidth = $('#bandwidth').val()
      }
      radio.country = $('#country').val();
      radio.channel = $('#channel').val();
      radio.beacon = $('#beacon').val();
      radio.dtim = $('#dtim').val();
      radio.ldpc = boole2able( $('#ldpc').prop('checked') );
      radio.stbc = boole2able( $('#stbc').prop('checked') );
      radio.shortgi = boole2able( $('#shortgi').prop('checked') );
      if ( $('#txpower').val() )
      {
        radio.txpower = $('#txpower').val()
      }
      else
      {
        radio.txpower = ""
      }

      if ( !ocompare( radio, radiocopy ) )
      {
        cmds.push( robj+"="+JSON.stringify(radio) );
      }
      if ( !ocompare( ssid, ssidcopy ) )
      {
          cmds.push( sobj+"="+JSON.stringify(ssid) );
      }
      if ( cmds.length == 0 )
      {
          page.alert( { message: $.i18n('Settings unchanged') } );
          return;
      }
      page.confirm( { message: $.i18n('The wireless client will be disconneted because of the change of configuration') } ).then( function(result){
        if (!result) return location.reload();
        if ( result )
        {
          he.exec( cmds ).then( function(){
            page.alert( {message:$.i18n('Make sure that the device is reconnected')} );
            var activeTab = $('#ssid_cfg .nav-tabs li.active a').attr('href') || '#tab-ssid';
            sessionStorage.setItem('wifi_active_tab', activeTab);
            location.reload();
          });
        }
      });
    }

                    formatter: function ( cellvalue, options, rowObject )
                    {
                        return '<button class="btn btn-warning btn-xs btn-choose" onclick="knock_client( ' + options.rowId + ')" data-id="' + options.rowId + '">' + $.i18n('Knock') + '</button>'
                    }
                }
            ],
            pager: '#clients-grid-pager-wifi',
            rowNum: 20,
            viewrecords: true,

            pgbuttons: true,
            pagerpos:'center',
            pginput:true,

            autowidth:true,
            loadonce:true,
            shrinkToFit:true,
            responsive:true,

            // 当用户进行分页操作时触发
            onPaging: function(pgButton) {
                //console.log('用户操作分页，按钮:', pgButton);

                // 如果用户输入页码
                if (pgButton === 'user') {
                    // 获取输入的页码
                    var inputPage = null;
                    var pagerInput = $(this).closest('.ui-jqgrid')
                                .find('.ui-pg-table .ui-pg-input');
        
                    if (pagerInput.length > 0) {
                        inputPage = parseInt(pagerInput.val(), 10);
                        //console.log('获取到输入页码:', inputPage);
                    }
                        // 如果输入的是第一页，设置标记
                        if (inputPage === 1) {
                            //console.log('用户输入页码1 重启定时器');
                            if (activeWifiTab === '#tab-clients') {
                              startRefreshTimer('#tab-clients');
                          }
                        }
                    }
                    // 如果是点击第一页按钮
                    else if (pgButton === 'first') {
                        //console.log('点击第一页按钮 重启定时器');
                        if (activeWifiTab === '#tab-clients') {
                              startRefreshTimer('#tab-clients');
                          }
                    }
                    // 如果是点击上一页按钮且当前在第二页
                    else if (pgButton === 'prev') {
                        var currentPage = $(this).getGridParam('page');
                        if (currentPage === 2) {
                            //console.log('从第二页点击上一页 重启定时器');
                            if (activeWifiTab === '#tab-clients') {
                              startRefreshTimer('#tab-clients');
                          }
                        }
                    }
                    
                    return true;
                },

            gridComplete: function() {
                // 绑定分页输入框事件
                var pagerInput = $(this).closest('.ui-jqgrid')
                                       .find('.ui-pg-table .ui-pg-input');
                
                if (pagerInput.length > 0) {
                    // 焦点获得时暂停定时器
                    pagerInput.on('focus', function() {
                        //console.log('分页输入框获得焦点，暂停定时器');
                        stopRefreshTimer();
                        inputFocused = true;
                    });
                    
                    // 焦点失去时处理
                    pagerInput.on('blur', function() {
                        //console.log('分页输入框失去焦点');
                        inputFocused = false;
                        
                        setTimeout(function() {
                            var currentPage = $(clients_table).getGridParam('page');
                            //console.log('失去焦点后检查，当前页:', currentPage, '输入框焦点:', inputFocused);
                            
                            if (activeWifiTab === '#tab-clients' && currentPage === 1 && !inputFocused) {
                                //console.log('在第一页且输入框无焦点，重启定时器');
                                startRefreshTimer('#tab-clients');
                            }
                        }, 100);
                    });
                }
                
                // 检查是否应该重启定时器
                var currentPage = $(this).getGridParam('page');
                if (activeWifiTab === '#tab-clients' && currentPage === 1 && !inputFocused) {
                    //console.log('在第一页且输入框无焦点，重启定时器');
                    startRefreshTimer('#tab-clients');
                }
            },
        }
      );

        var $toolbar = $("#t_" + clients_table.replace('#', ''));
        $toolbar.append($('#grid-controls').children());
        $toolbar.css({
            'display': 'flex',
            'justify-content': 'space-between', // 撑开两端
            'align-items': 'center',            // 垂直居中
            'background': '#f5f5f5',
            'padding': '8px 10px',
            'height': 'auto',                   // 覆盖默认高度
            //'border-bottom': '1px solid #e1e1e1' // 加个分割线
        });

      $('#rowNums').on('change',function(){
            var newRowNum = parseInt($(this).val(),10);
            $(clients_table).jqGrid('setGridParam',{rowNum:newRowNum}).trigger('reloadGrid')
        });

      /* load the configure */
      cfg_load();
      wifiacl_load();
      /*
      * 初始化当前 tab
      */
      activeWifiTab = $('#ssid_cfg .nav-tabs li.active a').attr('href') || '#tab-ssid';

      if (activeWifiTab === '#tab-clients') {
          load_clients(true);
          startRefreshTimer('#tab-clients');
      } else {
          stopRefreshTimer();
      }

      /*
      * 切换 tab 时，只启动当前 tab 的刷新
      */
      $('#ssid_cfg a[data-toggle="tab"]').off('shown.bs.tab.wifiRefresh').on('shown.bs.tab.wifiRefresh', function(e) {
          activeWifiTab = $(e.target).attr('href');

          stopRefreshTimer();

          if (activeWifiTab === '#tab-clients') {
              setTimeout(function() {
                  if ($(clients_table)[0] && $(clients_table)[0].grid) {
                      $(clients_table).jqGrid('setGridWidth', $('#tab-clients').width());
                  }

                  load_clients(true);
                  startRefreshTimer('#tab-clients');
              }, 100);
          } 
      });

      // 浏览器刷新前保存当前 tab
      $(window).off('beforeunload.wifiTab').on('beforeunload.wifiTab', function () {
          var currentTab = $('#ssid_cfg .nav-tabs li.active a').attr('href') || '#tab-ssid';
          sessionStorage.setItem(wifiTabStorageKey, currentTab);
      });

      // 页面加载后恢复 tab
      var savedTab = sessionStorage.getItem(wifiTabStorageKey);
      if (savedTab) {
          var $tab = $('#ssid_cfg a[href="' + savedTab + '"]');
          if ($tab.length) {
              $tab.tab('show');
          }
      }
      // 初始启动定时器
      // startRefreshTimer();

      /* bind the refresh */
      $('#refresh').on(ace.click_event, function () {
        var activeTab = $('#ssid_cfg .nav-tabs li.active a').attr('href') || '#tab-ssid';
        sessionStorage.setItem('wifi_active_tab', activeTab);
        location.reload();
      });
      /* bind the apply */
      $('#apply').on(ace.click_event, function () {
        ssid_save();
      });
    });

  })();

  /* 必须在全局中才可以被调用到 */
  function knock_client(  rowId )
  {
    // 某个选中行的数据
    var client = $('#clients-grid-table-wifi').jqGrid( 'getRowData', rowId );
    var mac = client.mac;
    // 执行唤醒
    he.exec( [ knock_object+".stabeat["+mac+"]" ], $.i18n("Waking up") ).then( function(v){
        var ret = v[0];
        if ( ret == true )
        {
            page.alert( { message: $.i18n('Knock it succeed'), callback: function( result ){location.reload();} } );
        }
        else
        {
            page.alert( { message: $.i18n('Knock it failed') } );
        }
    });
  }

</script>
