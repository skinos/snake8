<!-- ajax layout which only needs content area -->
<div class="row" id="page-modes">
  <div class="col-xs-12 form-btn-wrapper">
    <!-- PAGE CONTENT BEGINS -->
    <div class="form-horizontal" role="form">


      <!-- 状态 -->
      <div class="form-group" id="second_ssid" style="display: none;">

              <option value="tkip" data-i18n="TKIP"></option>
              <option value="aes" data-i18n="AES"></option>
              <option value="tkipaes" data-i18n="Auto"></option>

            <div class="clearfix">
              <span class="input-icon input-icon-right input-icon-form col-xs-10 col-sm-5">
                <input type="password" id="wpa_key" maxlength="128" autocomplete="new-password" />
                <i class="ace-icon fa fa-eye-slash" id="wpa_key-icon"></i>
              </span>
            </div>
          </div>
        </div>
        </div>  <!-- secure_cfg -->
        <!-- 隐藏SSID开关 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Hide SSID"></label>
          <div class="col-sm-9">
            <label>
              <input id="hide" class="ace ace-switch ace-switch-6" type="checkbox" />
              <span class="lbl"></span>
            </label>
          </div>
        </div>
        <!-- 隔离客户端 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Isolate Clients"></label>
          <div class="col-sm-9">
            <label>
              <input id="isolated" class="ace ace-switch ace-switch-6" type="checkbox" />
              <span class="lbl"></span>
            </label>
          </div>
        </div>
        <!-- ACL -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Clients ACL"></label>
            <div class="col-sm-9">
              <div class="btn-group">
                <div class="btn-group">
                  <a class="btn btn-second" data-i18n="ACL Settings" id="acl2" href="#"></a>
                </div>
              </div>
            </div>
        </div>

      </div> <!-- ssid_cfg -->



      <div class="hr hr32 hr-dotted"></div>



      <!-- 状态 -->
      <div class="form-group" id="third_ssid" style="display: none;">
        <label class="col-sm-3 control-label no-padding-right" data-i18n="Third SSID"></label>
        <div class="col-sm-9">
          <label>
            <input id="status2" class="ace ace-switch ace-switch-6" type="checkbox" />
            <span class="lbl"></span>
          </label>
        </div>
      </div>

      <div id="ssid_cfg3" style="display: none;">
        <!-- 名称 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="SSID"></label>
          <div class="col-sm-9">
            <div class="clearfix">
              <input type="text" id="ssid2" class="col-xs-10 col-sm-5" maxlength="32" />
            </div>
          </div>
        </div>
        <!-- 安全模式 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Security Mode"></label>
          <div class="col-sm-9">
            <select class="col-xs-10 col-sm-5" id="secure2">
              <option value="disable" data-i18n="Disable(None)"></option>
              <option value="wpapsk" data-i18n="WPA-PSK(Private)"></option>
              <option value="wpa2psk" data-i18n="WPA2-PSK(Private)"></option>
              <option value="wpapskwpa2psk" data-i18n="Mixed WPA-PSK(Private)"></option>

        <div id="secure_cfg2">
        <!-- WPA 模式 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="WPA Mode"></label>
          <div class="col-sm-9">
            <select class="col-xs-10 col-sm-5" id="wpa_encrypt2">
              <option value="tkip" data-i18n="TKIP"></option>
              <option value="aes" data-i18n="AES"></option>

            </select>

        <!-- 密码 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Password"></label>
          <div class="col-sm-9">
            <div class="clearfix">
              <span class="input-icon input-icon-right input-icon-form col-xs-10 col-sm-5">
                <input type="password" id="wpa_key2" maxlength="128" autocomplete="new-password" />

        <!-- 隐藏SSID开关 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Hide SSID"></label>
          <div class="col-sm-9">

              <input id="hide2" class="ace ace-switch ace-switch-6" type="checkbox" />

        <!-- 隔离客户端 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Isolate Clients"></label>
          <div class="col-sm-9">

      <div class="clearfix form-actions" id="button_ssid" style="display: none;">

        </div>
      </div>


    </div>
    <!-- PAGE CONTENT ENDS -->

</div><!-- /.row -->





<!-- page specific plugin scripts -->
<script type="text/javascript">
  (function () {
    /* get the object */
    var ssid2;
    var ssid3;
    var object = "wifi@x";
    var index = page.param( 'object', location.hash );
    if ( index )
    {
        object = index;
    }
    var langjson = base64.decode( page.param( 'lang', location.hash ) );
    var s2obj = object+"ssid2";
    var s3obj = object+"ssid3";
    var securelist;

    /* load the configure on the input */
    function cfg_load()
    {
      he.load( [ object+".securelist", s2obj, s3obj ] ).then( function(v){
        securelist = v[0];
        ssid2 = v[1];
        if (!ssid2){
          return;
        }
        ssid3 = v[2];
        
        $("#button_ssid").show();
        /* ssid2 */
        if ( securelist )
        {
            $("#secure").empty();            
            for( m in securelist )
            {
                $("#secure").append("<option value='"+m+"'>" + $.i18n(m) + "</option>");
            }
        }
        if ( ssid2 )
        {
            $("#second_ssid").show();
            $('#status').prop( 'checked', able2boole(ssid2.status) );
            $('#ssid').val( ssid2.ssid || '' );
            $('#secure').val( ssid2.secure || 'disable' );
            $('#wpa_encrypt').val( ssid2.wpa_encrypt || 'tkipaes' );
            $('#wpa_key').val( ssid2.wpa_key || '' );
            if ( ssid2.broadcast == "disable" )
            {
                $('#hide').prop( 'checked', true );
            }
            else
            {
                $('#hide').prop( 'checked', false );
            }
            $('#isolated').prop( 'checked', able2boole(ssid2.isolated) );
        }
        else
        {
            $('#status').prop( 'checked', false );
        }
		// secure
        if ( securelist )
        {
            $('#secure').unbind('change').change(function (e) {
              var secure = e.target.value;
			  if ( secure == "disable" || secure == "owe" )
			  {
                  $("#secure_cfg").hide();
			  }
			  else
			  {
                  $("#secure_cfg").show();
			      $("#wpa_encrypt").empty();            
	              if ( securelist[secure] )
	              {
	                  for( b in securelist[secure] )
	                  {
	                      $("#wpa_encrypt").append("<option value='"+b+"'>" + $.i18n(b) + "</option>");
	                  }
	              }
				  if ( ssid2 )
				  {
  		            $('#wpa_encrypt').val( ssid2.wpa_encrypt || 'aes' );
				  }
			  }
            }).trigger('change');
        }
		else
        {
	        $('#secure').unbind('change').change(function (e) {
	          var secure = e.target.value;
	          if ( secure === 'disable' )
	          {
	            $('#secure_cfg').hide();
	          }
	          else
	          {
	            $('#secure_cfg').show();
	          }
	        }).trigger('change');
		}
		// status
        $('#status').unbind('change').change(function () {
          if ($(this).prop('checked'))
          {
            $('#ssid_cfg2').show();
          }
          else
          {
            $('#ssid_cfg2').hide();
          }
        }).trigger('change');
        // ACL
        var link = '#app?page='+base64.encode("/skinos/wifi/acl.html");
        link += '&object='+s2obj;
        link += '&lang='+base64.encode(langjson);
        $('#acl2').attr( "href", link );

        /* ssid3 */
        if ( securelist )
        {
            $("#secure2").empty();            
            for( m in securelist )
            {
                $("#secure2").append("<option value='"+m+"'>" + $.i18n(m) + "</option>");
            }
        }
        if ( ssid3 )
        {
            $("#third_ssid").show();
            $('#status2').prop( 'checked', able2boole(ssid3.status) );
            $('#ssid2').val( ssid3.ssid || '' );
            $('#secure2').val( ssid3.secure || 'disable' );
            $('#wpa_encrypt2').val( ssid3.wpa_encrypt || 'tkipaes' );
            $('#wpa_key2').val( ssid3.wpa_key || '' );
            if ( ssid3.broadcast == "disable" )
            {
                $('#hide2').prop( 'checked', true );
            }
            else
            {
                $('#hide2').prop( 'checked', false );
            }
            $('#isolated2').prop( 'checked', able2boole(ssid3.isolated) );
        }
        else
        {
            $('#status2').prop( 'checked', false );
        }
        // secure
        if ( securelist )
        {
            $('#secure2').unbind('change').change(function (e) {
              var secure = e.target.value;
			  if ( secure == "disable" || secure == "owe" )
			  {
                  $("#secure_cfg2").hide();
			  }
			  else
			  {
                  $("#secure_cfg2").show();
			      $("#wpa_encrypt2").empty();            
	              if ( securelist[secure] )
	              {
	                  for( b in securelist[secure] )
	                  {
	                      $("#wpa_encrypt2").append("<option value='"+b+"'>" + $.i18n(b) + "</option>");
	                  }
	              }
				  if ( ssid3 )
				  {
  		            $('#wpa_encrypt2').val( ssid3.wpa_encrypt || 'aes' );
				  }
			  }
            }).trigger('change');
        }
		else
        {
	        $('#secure2').unbind('change').change(function (e) {
	          var secure = e.target.value;
	          if ( secure === 'disable' )
	          {
	            $('#secure_cfg2').hide();
	          }
	          else
	          {
	            $('#secure_cfg2').show();
	          }
	        }).trigger('change');
		}
		// status
        $('#status2').unbind('change').change(function () {
          if ($(this).prop('checked'))
          {
            $('#ssid_cfg3').show();
          }
          else
          {
            $('#ssid_cfg3').hide();
          }
        }).trigger('change');
        // ACL
        var link = '#app?page='+base64.encode("/skinos/wifi/acl.html");
        link += '&object='+s3obj;
        link += '&lang='+base64.encode(langjson);
        $('#acl3').attr( "href", link );
      })
    }

    /* save the configure */
    function ssid_save()
    {
      var cmds = [];
      var ssid2copy = null;
      var ssid3copy = null;
      var restart = false;

      if ( ssid2 == null )
      {
        ssid2 = {};
      }
      ssid2copy = JSON.parse(JSON.stringify(ssid2));
      ssid2.status = boole2able( $('#status').prop('checked') );
      if ( ssid2.status == "enable" )
      {
        ssid2.ssid = $('#ssid').val();
        ssid2.secure = $('#secure').val();
        if ( ssid2.secure != 'disable' && ssid2.secure != 'owe' )
        {
          ssid2.wpa_encrypt = $('#wpa_encrypt').val()||"aes";
          ssid2.wpa_key = $('#wpa_key').val();
        }
        ssid2.broadcast = boole2able( ! $('#hide').prop('checked') );
        ssid2.isolated = boole2able( $('#isolated').prop('checked') );
      }
      if ( ssid2copy.status != ssid2.status )
      {
      	restart = true;
      }
      if ( ssid3 == null )
      {
        ssid3 = {};
      }
      ssid3copy = JSON.parse(JSON.stringify(ssid3));
      ssid3.status = boole2able( $('#status2').prop('checked') );
      if ( ssid3.status == "enable" )
      {
        ssid3.ssid = $('#ssid2').val();
        ssid3.secure = $('#secure2').val();
        if ( ssid3.secure != 'disable' && ssid3.secure != 'owe' )
        {
          ssid3.wpa_encrypt = $('#wpa_encrypt2').val()||"aes";
          ssid3.wpa_key = $('#wpa_key2').val();
        }
        ssid3.broadcast = boole2able( ! $('#hide2').prop('checked') );
        ssid3.isolated = boole2able( $('#isolated2').prop('checked') );
      }
      if ( ssid3copy.status != ssid3.status )
      {
      	restart = true;
      }

      if ( !ocompare( ssid2, ssid2copy ) )
      {
        cmds.push( s2obj+"="+JSON.stringify(ssid2) );
      }
      if ( !ocompare( ssid3, ssid3copy ) )
      {
          cmds.push( s3obj+"="+JSON.stringify(ssid3) );
      }
      if ( cmds.length == 0 )
      {
          page.alert( { message: $.i18n('Settings unchanged') } );
          return;
      }
      if ( restart == true )
      {
          page.confirm( { message: $.i18n('The system will restart because of the change of configuration') } ).then( function(result){
            if (!result) return location.reload();  
            if ( result )
              {
                  he.exec( cmds ).then( function(){
                      page.confirm( { message: $.i18n('Need to restart the system') } ).then( function(result){
                          if ( result )
                          {
                              he.reboot( { title: $.i18n('Restarting to apply...'), hint:$.i18n('Make sure that the device is reconnected') } );
                          }
                          else
                          {
                              cfg_load();
                          }
                      });
                  });
              }
          });
      }
      else
      {
          page.confirm( { message: $.i18n('The wireless client will be disconneted because of the change of configuration') } ).then( function(result){
            if ( result )
            {
              he.exec( cmds ).then( function(){
                page.alert( {message:$.i18n('Make sure that the device is reconnected')} );
                location.reload();
              });
            }
          });
      }
    }


    /* init */
    page.password('wpa_key', 'wpa_key-icon' );
    page.password('wpa_key2', 'wpa_key-icon2' );
    $.i18n().load( page.lang(langjson) ).then( function () {
      /* init the langauage */
      $.i18n().locale = lang; $('body').i18n();
      /* load the configure */
      cfg_load();
      /* bind the refresh */
      $('#refresh').on(ace.click_event, function () {
        location.reload();
      });
      /* bind the apply */
      $('#apply').on(ace.click_event, function () {
        ssid_save();
      });
    });

  })();
</script>
