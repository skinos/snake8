<!-- ajax layout which only needs content area -->
<div class="row">
  <div class="col-xs-12 form-btn-wrapper">
    <!-- PAGE CONTENT BEGINS -->
    <div class="form-horizontal" role="form">

    <table id="clients-grid-table-wifi"></table>
    <div id="clients-grid-pager-wifi"></div>

    <div id="grid-controls" style="display: none;">
        <div style="display: flex; align-items: center">
        <label for="rowNums" style="margin-right: 5px; white-space: nowrap;" data-i18n="Display"></label>
        <select id="rowNums" style="width: 60px;">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="200">200</option>
        </select>
        </div>
    </div>

    </div>
    <!-- PAGE CONTENT ENDS -->
  </div><!-- /.col -->
</div><!-- /.row -->

<!-- page specific plugin scripts -->
<script type="text/javascript">
window.wifi_client = window.wifi_client || {
    timer: null,
    currentObject: null
};

  var knock_object = null;
  (function () {
    var timer;
    var stalist;
    var clients;
    var inputFocused = false;
    var object = "wifi@x";
    var index = page.param( 'object', location.hash );
    if ( index )
    {
        object = index;
    }
    knock_object = object;
    var langjson = base64.decode( page.param( 'lang', location.hash ) );
    var clients_table = '#clients-grid-table-wifi';
    var clients_pager = '#clients-grid-pager-wifi';

    if (window.wifi_client.timer) {
        clearInterval(window.wifi_client.timer);
        window.wifi_client.timer = null;
    }
    // 记录当前页面正在操作的对象
    window.wifi_client.currentObject = object;

    /* load the table infomation */
    function load_clients()
    {
        if ($(clients_table).length === 0) {
            stopRefreshTimer();
            return;
        }

        he.bkload( [ object+".stalist", 'client@station.list' ] ).then( function(v){
            if (window.wifi_client.currentObject !== object) {
                return; 
            }

            stalist = v[0];
            if ( !stalist )
            {
                stalist = {};
            }
            clients = v[1];
            if ( !clients )
            {
                clients = {};
            }
            // 合并
            var count = 0;
            var rows = [];
            for ( var index in stalist )
            {
                var sta = stalist[index];
                var client = clients[index];
                var row = {};
                row[ 'mac'] =  index;
				if ( client )
				{
	                row[ 'name'] = client.name || '';
	                row[ 'ip'] = client.ip || '';
				}
                if ( sta.rx_bytes || sta.tx_bytes )
                {
                    row[ 'rxtx' ] = byte2readable( sta.rx_bytes ) + " / " + byte2readable(sta.tx_bytes);
                }
                else
                {
                	if ( client )
					{
	                    if ( !client.rx_bytes )
	                    {
	                        client.rx_bytes = "0";
	                    }
	                    if ( !client.tx_bytes )
	                    {
	                        client.tx_bytes = "0";
	                    }
	                    row[ 'rxtx' ] = byte2readable( client.rx_bytes ) + " / " + byte2readable(client.tx_bytes);
					}
                }
                if ( sta.rssi )
                {
                    row[ 'rssi'] = sta.rssi+'dBm';
                }
                else
                {
                    row[ 'rssi'] = '';
                }
				if ( sta.livetime )
                {
                    row[ 'livetime'] = time2string(sta.livetime);
                    count++;
                    rows.unshift( row );
				}
				else
                {
                    row[ 'livetime'] = $.i18n('Leave');
                    rows.push( row );
                }
            }
            if (window.wifi_client.currentObject !== object) return;

            // 表头设置为在线客户端的数量
            $(clients_table).jqGrid( "setCaption", $.i18n('Online Number') + ' (' + count + ')' );
            // 记住滚动条的位置
            var scrollPos = jqtable.getScrollPos();
            // 获取当前分页状态
            var currentPage = $(clients_table).jqGrid('getGridParam', 'page');
            var currentRowNum = $(clients_table).jqGrid('getGridParam', 'rowNum');
            
            // 给clients表格设置数据
            $(clients_table).jqGrid('setGridParam', {
                data: rows,
                page: currentPage,
                rowNum: currentRowNum
            }).trigger('reloadGrid');
            // 恢复滚动条的位置
            jqtable.setScrollPos(scrollPos);
            // 改变离线行的颜色
            $('td[title=' + $.i18n('Leave') + ']').closest('tr').css({color: '#888'});
        });
    }

    function startRefreshTimer() {
        stopRefreshTimer();

        window.wifi_client.timer = setInterval(function() {  
            // 检查：如果对象不匹配（页面已切），停止定时器
            if (window.wifi_client.currentObject !== object || $(clients_table).length === 0) {
                stopRefreshTimer();
                return;
            }

            var currentPage = $(clients_table).jqGrid('getGridParam', 'page');  
            if (currentPage === 1) {  
                load_clients();  
            }  
        }, 1000);
        
        //console.log('定时器已启动');
    }

    function stopRefreshTimer() {
        if (window.wifi_client.timer) {  
            clearInterval(window.wifi_client.timer);  
            window.wifi_client.timer = null;  
        }  
    }

    $.i18n().load( page.lang(langjson) ).then( function () {
      /* init the langauage */
      $.i18n().locale = lang; $('body').i18n();
      /* load the configure */
      jqtable.create(  clients_table, clients_pager,
        {
            caption: ' ', // 必需设置值, 防止表格不能折叠
            toolbar: [true, "top"],
            multiselect: false,
            colNames: [ $.i18n('Hostname'), $.i18n('MAC Address'), $.i18n('IP Address'), $.i18n('Live Time'), $.i18n('Rx/Tx'), $.i18n('RSSI'), $.i18n('Operation') ],
            colModel: [
                { name:'name', width:200, editable:true },
                { name:'mac', width:120, editable:true, editrules:{ required:true } },
                { name:'ip', width:110 },
                { name:'livetime', width:90 },
                { name:'rxtx', width:150 },
                { name:'rssi', width:150 },
                {
                    name: 'wakeup', width: 80,
                    fixed: true, sortable: false,
                    formatter: function ( cellvalue, options, rowObject )
                    {
                        return '<button class="btn btn-warning btn-xs btn-choose" onclick="knock_client( ' + options.rowId + ')" data-id="' + options.rowId + '">' + $.i18n('Knock') + '</button>'
                    }
                }
            ],
            pager: '#clients-grid-pager-wifi',
            rowNum: 20,
            viewrecords: true,

            pgbuttons: true,
            pagerpos:'center',
            pginput:true,

            autowidth:true,
            loadonce:true,
            shrinkToFit:true,
            responsive:true,

            // 当用户进行分页操作时触发
            onPaging: function(pgButton) {
                //console.log('用户操作分页，按钮:', pgButton);

                // 如果用户输入页码
                if (pgButton === 'user') {
                    // 获取输入的页码
                    var inputPage = null;
                    var pagerInput = $(this).closest('.ui-jqgrid')
                                .find('.ui-pg-table .ui-pg-input');
        
                    if (pagerInput.length > 0) {
                        inputPage = parseInt(pagerInput.val(), 10);
                        //console.log('获取到输入页码:', inputPage);
                    }
                        // 如果输入的是第一页，设置标记
                        if (inputPage === 1) {
                            //console.log('用户输入页码1 重启定时器');
                            startRefreshTimer();
                        }
                    }
                    // 如果是点击第一页按钮
                    else if (pgButton === 'first') {
                        //console.log('点击第一页按钮 重启定时器');
                        startRefreshTimer();
                    }
                    // 如果是点击上一页按钮且当前在第二页
                    else if (pgButton === 'prev') {
                        var currentPage = $(this).getGridParam('page');
                        if (currentPage === 2) {
                            //console.log('从第二页点击上一页 重启定时器');
                            startRefreshTimer();
                        }
                    }
                    
                    return true;
                },

            gridComplete: function() {
                // 绑定分页输入框事件
                var pagerInput = $(this).closest('.ui-jqgrid')
                                       .find('.ui-pg-table .ui-pg-input');
                
                if (pagerInput.length > 0) {
                    // 焦点获得时暂停定时器
                    pagerInput.on('focus', function() {
                        //console.log('分页输入框获得焦点，暂停定时器');
                        stopRefreshTimer();
                        inputFocused = true;
                    });
                    
                    // 焦点失去时处理
                    pagerInput.on('blur', function() {
                        //console.log('分页输入框失去焦点');
                        inputFocused = false;
                        
                        setTimeout(function() {
                            var currentPage = $(clients_table).getGridParam('page');
                            //console.log('失去焦点后检查，当前页:', currentPage, '输入框焦点:', inputFocused);
                            
                            if (currentPage === 1 && !inputFocused) {
                                //console.log('在第一页且输入框无焦点，重启定时器');
                                startRefreshTimer();
                            }
                        }, 100);
                    });
                }
                
                // 检查是否应该重启定时器
                var currentPage = $(this).getGridParam('page');
                if (currentPage === 1 && !inputFocused) {
                    //console.log('在第一页且输入框无焦点，重启定时器');
                    startRefreshTimer();
                }
            },
        }
      );

        var $toolbar = $("#t_" + clients_table.replace('#', ''));
        $toolbar.append($('#grid-controls').children());
        $toolbar.css({
            'display': 'flex',
            'justify-content': 'space-between', // 撑开两端
            'align-items': 'center',            // 垂直居中
            'background': '#f5f5f5',
            'padding': '8px 10px',
            'height': 'auto',                   // 覆盖默认高度
            //'border-bottom': '1px solid #e1e1e1' // 加个分割线
        });

      $('#rowNums').on('change',function(){
            var newRowNum = parseInt($(this).val(),10);
            $(clients_table).jqGrid('setGridParam',{rowNum:newRowNum}).trigger('reloadGrid')
        });

      load_clients();

      // 初始启动定时器
      startRefreshTimer();

      //$(window).on('unload', stopRefreshTimer);

      /* 设置定时器 */
    //   timer = page.timing({
    //     refresh: function ()
    //     {
    //         load_clients()
    //     },
    //     interval: 1000
    //   });

    });


  })();

  /* 必须在全局中才可以被调用到 */
  function knock_client(  rowId )
  {
    // 某个选中行的数据
    var client = $('#clients-grid-table-wifi').jqGrid( 'getRowData', rowId );
    var mac = client.mac;
    // 执行唤醒
    he.exec( [ knock_object+".stabeat["+mac+"]" ], $.i18n("Waking up") ).then( function(v){
        var ret = v[0];
        if ( ret == true )
        {
            page.alert( { message: $.i18n('Knock it succeed'), callback: function( result ){location.reload();} } );
        }
        else
        {
            page.alert( { message: $.i18n('Knock it failed') } );
        }
    });
  }

</script>
