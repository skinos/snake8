    function lte_show(info,id)
    {
        if(!info){
            return;
        }

        // 运营商
        var operatorText = "";
        if (info.operator) {
            operatorText = $.i18n(info.operator);
        } else if (info.plmn) {
            operatorText = $.i18n(info.plmn);
        }

        // CSQ
        $(id + "_csq").text(info.csq || "");

        // 网络类型
        $(id + "_nettype").text(info.nettype || "");
        $(id + "_nettype5").text(info.nettype2 || "");

        // 信号图标 - 4G
        if (info.signal) {
            $(id + "_rssiimg").attr("src", "/assets/css/images/signal_" + info.signal + ".png");
        } else {
            $(id + "_rssiimg").attr("src", "/assets/css/images/signal_0.png");
        }
        
        // 信号图标 - 5G
        if (info.signal2) {
            $(id + "_rssiimg5").attr("src", "/assets/css/images/signal_" + info.signal2 + ".png");
        } else {
            $(id + "_rssiimg5").attr("src", "/assets/css/images/signal_0.png");
        }

        // 延迟
        if (info.delay) {
            if (info.delay === "failed" || info.delay === "block") {
                $(id + "_delay").text($.i18n(info.delay));
            } else {
                $(id + "_delay").text(info.delay + "ms");
            }
        } else {
            $(id + "_delay").text("");
            $(id + "_tipp").text($.i18n('No Data'));
        }

        // 判断4G和5G是否有内容
        var has4G = info.signal || info.nettype || info.csq;
        var has5G = info.signal2 || info.nettype2;
        
        if (has5G) {
            // 只要有5G（无论有没有4G），只显示5G
            $(id + "_5g_head").show();
            $(id + "_tip").hide();
            $(id + "_operator5").text(operatorText || "");
        } 
        else if (has4G) {
            // 没有5G，但有4G，显示4G
            $(id + "_4g_head").show();
            $(id + "_tip").hide();
            $(id + "_operator").text(operatorText || "");
        } 
        else if (operatorText) {
            // 没信号但有运营商信息（兜底显示在4G位置）
            $(id + "_4g_head").show();
            $(id + "_tip").hide();
            $(id + "_operator").text(operatorText);
            $(id + "_nettype, " + id + "_csq").text(""); 
        }
        else {
            $(id + "_4g_head").hide();
            $(id + "_5g_head").hide();
            $(id + "_tip").show();
            $(id + "_tip").text($.i18n('No Signal'));
        }

        // 延迟头部显示控制
        if (info.delay) {
            $(id + "_delay_head").show();
        } else {
            $(id + "_delay_head").hide();
        }
    }

    function wisp_show(info,id)

            $(id + "_rssi").text(info.rssi + "dBm");

            $(id + "_rssi").text("");
        }

        if (info.signal) {
            $(id + "_tip").hide();
            $(id + "_rssiimg").attr("src", "/assets/css/images/signal_" + info.signal + ".png");
        } else {
            $(id + "_rssiimg").hide();
            $(id + "_tip").show();
            $(id + "_tip").text($.i18n('No Signal'));

         // 延迟
        if (info.delay) {
            $(id + "_delay_head").show();
            if (info.delay === "failed" || info.delay === "block") {
                $(id + "_delay").text($.i18n(info.delay));
            } else {
                $(id + "_delay").text(info.delay + "ms");
            }
        } else {
            $(id + "_delay_head").hide();
            $(id + "_delay").text("");
            $(id + "_tipp").text($.i18n('No Data'));
        }
    }

    /* load the configure fill the page */
    function frame_load()
    {
        he.load( [ "network@frame", "network@frame.list[extern]" ] ).then( function(v){
            frame = v[0];
            if ( !frame )
            {
                return;
            }
            interfaces = v[1];
            $('#type').val( frame.type );

            main_html();
            $('#main').val( frame['1'] );

            back_html();
            $('#back').val( frame['2'] );

            king_html();
            $('#king').val( frame['3'] );

            reserve_html();
            $('#reserve').val( frame['4'] );

            reserve2_html();
            $('#reserve2').val( frame['5'] );

            reserve3_html();
            $('#reserve3').val( frame['6'] );

            reserve4_html();
            $('#reserve4').val( frame['7'] );

            reserve5_html();
            $('#reserve5').val( frame['8'] );

            reserve6_html();
            $('#reserve6').val( frame['9'] );

            reserve7_html();
            $('#reserve7').val( frame['10'] );

            dns_html();
            $('#custom_dns').val( frame.custom_dns||"disable" );
            $('#cdns').val( frame.dns );
            $('#cdns2').val( frame.dns2 );
            $('#delay_count').val( frame.delay_count );
            $('#delay_divide').val( frame.delay_divide );
            $('#delay_diff').val( frame.delay_diff );
            /* load the configure */
            $('#type').unbind('change').change(function (e) {
              var type = e.target.value;
              if ( type == "default" )
              {
                  $('#dns-sets').hide();
                  $('#delay-sets').hide();
              }
              else if ( type == "dbdc" || type == "dbdc2" || type == "dbdc3" || type == "dbdc4" )
              {
                $('#dns-sets').show();
                $('#delay-sets').show();
              }
			  else
              {
                $('#dns-sets').show();
                $('#delay-sets').hide();
			  }
            }).trigger('change');
            $('#custom_dns').unbind('change').change(function (e) {
              var type = e.target.value;
              if ( type == "enable" )
              {
                $('#customdns_config').show();
              }
              else
              {
                $('#customdns_config').hide();
              }
            }).trigger('change');
        });
    }
    function frame_save()
    {
        if ( frame == null )
        {
            return;
        }
        framecopy = JSON.parse(JSON.stringify(frame));
        frame.type = $('#type').val();
        frame.main = $('#main').val();
        frame.back = $('#back').val();
        frame.king = $('#king').val();
        frame.reserve = $('#reserve').val();
        frame.reserve2 = $('#reserve2').val();
        frame.reserve3 = $('#reserve3').val();

        frame.reserve4 = $('#reserve4').val();
        frame.reserve5 = $('#reserve5').val();
        frame.reserve6 = $('#reserve6').val();
        frame.reserve7 = $('#reserve7').val();

        frame.custom_dns = $('#custom_dns').val();
        if ( frame.custom_dns == "enable" )
        {
            frame.dns = $('#cdns').val();
            frame.dns2 = $('#cdns2').val();
        }
        if ( frame.type == "dbdc" )
        {
            frame.delay_count = $('#delay_count').val();
            frame.delay_divide = $('#delay_divide').val();
            frame.delay_diff = $('#delay_diff').val();
        }
        if ( ocompare( frame, framecopy ) )
        {
            page.alert( { message: $.i18n('Settings unchanged') } );
            return;
        }
        page.confirm( { message: $.i18n('The connection will be disconneted because of the change of configuration') } ).then( function(result){
            if ( result )
            {
                he.exec( [ "network@frame="+JSON.stringify(frame) ] ).then( function(){
                    page.hint2succeed( $.i18n('Modify successfully') );
                    frame_load();
                    status_load();
                });
            }
            else
            {
                frame_load();
            }
        });
    }
