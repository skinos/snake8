<!-- ajax layout which only needs content area -->
<style>
  p {
    margin: 26px 8px;
  }
</style>

<div class="row">
  <div class="col-xs-12">
    <!-- PAGE CONTENT BEGINS -->

  <div id="sdk_html" style="display: none;">
    <h4 data-i18n="a. How to download the SDK and compile an upgrade package"></h4>
    <p data-i18n="1. It is recommended to download this SDK after setting up the build environment in Ubuntu."></p>
    <p data-i18n="2. Run the following command in an Ubuntu terminal to download the SDK:" ></p>
    <p data-i18n="git clone https://gitee.com/snake8/snake8.git" ></p>
    <p data-i18n="3. After the download is complete, enter the snake8 directory and run the following commands to update the SDK to the latest version:" ></p>
      cd snake8 <br>
      make preset</br>
      make pid gBOARDID=<span id="gBOARDID"></span><br>
      make update</br>
      make menu</br>
    <p data-i18n="4. After the update is complete, run the following commands to compile the target product:" ></p>
      make dep <br>
      make
    <p data-i18n="5. After compilation, an upgrade package file ending with .zz will be generated in the ./build directory. You can upload it from the upgrade page."></p>



    <h4 data-i18n="b. How to develop your own program"></h4>
    <p data-i18n="1. The Readme.md file in the SDK directory provides a basic introduction to the SDK and development flow."></p>
    <p data-i18n="2. https://gitee.com/snake8/doc.git provides step-by-step component development documentation (under preparation)."></p>
    <p data-i18n="3. These documents are updated from time to time. Run make update in the SDK directory to refresh them."></p>
    <p data-i18n="4. Visit www.ashyelf.com for more development help (under construction)."></p>

  </div>

    <!-- PAGE CONTENT ENDS -->
  </div><!-- /.col -->
</div><!-- /.row -->

<!-- page specific plugin scripts -->
<script type="text/javascript">
(function () {
    $.i18n().load( page.lang('sdk') ).then( function () {
      /* init the language */
      $.i18n().locale = lang; $('body').i18n();

      $('#sdk_html').show();

      he.load( [ 'land@machine.status' ] ).then( function(v){
          var gBOARDID = '';
          var platform = v[0].platform;
          if ( platform == "smtk" )
          {
            platform = "mtk";
          }
          else if ( platform == "smtk2" )
          {
            platform = "mtk2";
          }
          else if ( platform == "srkc" )
          {
            platform = "rkc";
          }
          if ( v[0].scope == "std" )
          {
            gBOARDID = platform + '-' + v[0].hardware + '-' + v[0].custom;
          }
          else
          {
            gBOARDID = platform + '-' + v[0].hardware + '-' + v[0].custom + '-' + v[0].scope;
          }
          $('#gBOARDID').text(gBOARDID);
      });
    });
})();
</script>
