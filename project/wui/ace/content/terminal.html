<!-- ajax layout which only needs content area -->
<div class="row">
  <div class="col-xs-12">
    <!-- PAGE CONTENT BEGINS -->

    <div id="tips" class="alert alert-warning" style="display: none;">
      <button type="button" class="close" data-dismiss="alert">
        <i class="ace-icon fa fa-times"></i>
      </button>
      <span data-i18n="I'm sorry that this feature does not support the current browser. It is recommended that you update and install Chrome, Firefox or IE11+."></span>
    </div>
    <iframe id="terminal" frameborder="0" width="100%" height="500px" style="display: none;"></iframe>


    <!-- PAGE CONTENT ENDS -->
  </div><!-- /.col -->
</div><!-- /.row -->

<!-- page specific plugin scripts -->
<script type="text/javascript">
  (function () {

    if ( window.ie && window.ie < 11)
    {
      $('#terminal').hide();
      $('#tips').show();
    } 
    function open_term()
    {
        if ( window.ie && window.ie < 11)
        {
          $('#terminal').hide();
          $('#tips').show();
          return;
        } 
        else
        {
          setTimeout(function () {
            var wh = $(window).height();
            $('#terminal').attr('height', wh - 130 + 'px');
            $('#terminal').attr(
                'src',
                window.location.protocol + "//" + window.location.hostname + ':' + (window.ttyd_port || '81')
            );
            $('#terminal').show();
            $('#tips').hide();
        }, 300);
        }
    }

    $.i18n().load( page.lang('debug') ).then( function () {        
      /* init the langauage */
      $.i18n().locale = lang; $('body').i18n();

      /* load the configure */
      he.load( [ 'wui@ttyd.setup'] ).then( function(v){
        
          open_term();
      });

    });


  })();
</script>
