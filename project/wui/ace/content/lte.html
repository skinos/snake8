<style>
/* 像firewll框架那样 没有边框 只有标签页顶部导航栏 */
/* 加上标签页自带的框架边框 就可能会导致切换标签页时高度塌陷 导致强烈白光的效果 也就是页面被刷新了几次所导致 */
/* 每个标签页内容不同 边框高度也就不同 切换时会有高度塌陷的情况 */
.tab-content {
    background-color: transparent !important; /* 设为透明 */
    border: none !important;
    padding: 0 !important;
    min-height: 1px;
}

.tab-pane {
    background-color: transparent !important;
}

.tab-pane.fade {
    opacity: 1 !important;
    transition: none !important;
}
</style>
