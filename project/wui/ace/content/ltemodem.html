<!-- ajax layout which only needs content area -->
<div class="row" id="page-modes">
  <div class="col-xs-12 form-btn-wrapper">
    <!-- PAGE CONTENT BEGINS -->
    <div class="form-horizontal" role="form" style="margin-top: 20px;">


        <!-- GNSS -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="GNSS"></label>
          <div class="col-sm-9">
            <label>
              <input id="gnss" class="ace ace-switch ace-switch-6" type="checkbox" />
              <span class="lbl"></span>
            </label>
          </div>
        </div>

        <!-- 网络模式 -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Attach Mode"></label>
          <div class="col-sm-9">
            <select class="col-xs-10 col-sm-5" id="lock_nettype">
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="PIN Code"></label>
          <div class="col-sm-9">
            <input type="text" id="lock_pin" class="col-xs-10 col-sm-5" maxlength="128" />
          </div>
        </div>

        <!-- IMEI -->
        <div class="form-group">
            <label class="col-sm-3 control-label no-padding-right" data-i18n="Lock IMEI"></label>
            <div class="col-sm-9" style="display: flex; align-items: center;">
                <div id="lock_imei" class="form-right-text" style="width: 14%; margin-right: 10px;"></div>
                <button class="btn btn-main btn-mini" id="imei_lock" data-i18n="Lock" style="padding: 4px 12px; font-size: 12px;"></button>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label no-padding-right" data-i18n="Lock IMSI"></label>

                <button class="btn btn-main btn-mini" id="imsi_lock" data-i18n="Lock" style="padding: 4px 12px; font-size: 12px;"></button>
            </div>
        </div>

        <div class="hr hr32 hr-dotted"></div>
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Watch Interval"></label>

        <div class="form-group">

          <div class="col-sm-9">
