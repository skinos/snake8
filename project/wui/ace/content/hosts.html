<!-- ajax layout which only needs content area -->
<div class="row">
    <div class="col-xs-12 form-btn-wrapper">
    <!-- PAGE CONTENT BEGINS -->


      
        <table id="hosts-grid-table"></table>
        <div id="hosts-grid-pager"></div>

        <div id="grid-controls" style="display: none;">
            <div style="display: flex; align-items: center">
            <label for="rowNums" style="margin-right: 5px; white-space: nowrap;" data-i18n="Display"></label>
            <select id="rowNums" style="width: 60px;">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
            </select>
            </div>
        </div>
        

        <!-- Hint -->
        <div class="hr hr32 hr-dotted"></div>
        <span class="grey" id="tip" style="display: none;" data-i18n="Warning: To use this mapping, intranet devices must set DNS to this router."></span>


        <div class="clearfix form-actions" id="button_hosts" style="display: none;">
            <div class="col-md-offset-3 col-md-9">
                <button class="btn btn-second" type="button" id="refresh"><span data-i18n="Refresh"></span></button>
                &nbsp; &nbsp; &nbsp;
                <button class="btn btn-main" type="button" id="apply"><span data-i18n="Apply"></span></button>
            </div>
        </div>


    <!-- PAGE CONTENT ENDS -->
    </div><!-- /.col -->
</div><!-- /.row -->

<script src="/js/hosts.js"></script>
