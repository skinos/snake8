<!-- ajax layout which only needs content area -->
<div class="row" id="page-modes">
  <div class="col-xs-12 form-btn-wrapper">
    <!-- PAGE CONTENT BEGINS -->
    <div class="form-horizontal" role="form" style="margin-top: 20px;">
        <table id="set-grid-table"></table>
        <div id="set-grid-pager"></div>

        <div id="grid-controls" style="display: none;">
          <div style="display: flex; align-items: center">
            <label for="rowNums" style="margin-right: 5px; white-space: nowrap;" data-i18n="Display"></label>
            <select id="rowNums" style="width: 60px;">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </div>
        </div>

        <div class="hr hr32 hr-dotted"></div>
        <table id="watch-grid-table"></table>
        <div id="watch-grid-pager"></div>

        <div id="grid-controls2" style="display: none;">
          <div style="display: flex; align-items: center">
            <label for="rowNums" style="margin-right: 5px; white-space: nowrap;" data-i18n="Display"></label>
            <select id="rowNums" style="width: 60px;">
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </div>
        </div>


      <div class="clearfix form-actions">
        <div class="col-md-offset-3 col-md-9">
          <button class="btn btn-second" type="button" id="at_refresh"><span data-i18n="Refresh"></span></button>
          &nbsp; &nbsp; &nbsp;
          <button class="btn btn-main" type="button" id="at_apply"><span data-i18n="Apply"></span></button>
        </div>
      </div>
      
    </div>
  </div>
</div>
