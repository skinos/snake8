
<!-- ajax layout which only needs content area -->

        </div>

        <div class="hr hr32 hr-dotted"></div>

          <label class="col-sm-3 control-label no-padding-right" data-i18n="Address 3"></label>
          <div class="col-sm-9">
            <label>
              <input id="ipmask3" class="ace ace-switch ace-switch-6" type="checkbox" />
              <span class="lbl"></span>

          </div>
        </div>
        
        <div id="ipmask3_cfg" style="display: none;">
            <!-- IP地址 -->
            <div class="form-group">

                <div class="col-sm-9">
                  <div class="clearfix">
                    <input type="text" id="ip3" class="col-xs-10 col-sm-5" maxlength="128" />

                    <input type="text" id="mask3" class="col-xs-10 col-sm-5" maxlength="128" />

      <div class="form-group">
        <label class="col-sm-3 control-label no-padding-right" data-i18n="DHCP Server"></label>
        <div class="col-sm-9">
          <label>
            <input id="dhcps" class="ace ace-switch ace-switch-6" type="checkbox" />
            <span class="lbl"></span>
          </label>
        </div>
      </div>
      
      <div id="pool_cfg" style="display: none;">

        <!-- 起始IP -->
        <div class="form-group">
          <label class="col-sm-3 control-label no-padding-right" data-i18n="Start IP Address"></label>
          <div class="col-sm-9">
            <div class="clearfix">

          </div>

        <div class="form-group">

            </div>
        </div>
      </div><!-- dhcpsSets -->







        <div id="ipv6_cfg" style="display: none;" >

            <div class="hr hr32 hr-dotted"></div>

            </div>
            <div id="manual_cfg" style="display: none;" >
