		<!-- inline scripts related to this page -->
		<script type="text/javascript">
		window.hepath = "/public";
		window.key = "";
		window.username = "";
		localStorage.setItem( "key", "" );
		localStorage.setItem( "username", "" );
		jQuery(function($) {


			he.load( [ 'wui@admin', 'land@machine', 'land@machine.status', 'arch@custom' ] ).then( function(v){
				window.wui = v[0];
				window.machine = v[1];
				window.machines = v[2];
				window.custom = v[3];
				window.lang = window.machine.language;
				document.title = window.machine.name;

				// prompt
				$('#prompt').html( document.title );
				// logo
				if ( window.wui && window.wui.logo_file )
				{
				    $('body').attr('class', 'login-layout light-login');
				    var stamp = '<img src="' + window.wui.logo_file + '" width="' + (window.wui.logo_width || '180px') + '" height="' + (window.wui.logo_height || '100px') + '" /></div>';
				    if ( window.wui.logo_align )
					{
				        $('#logo').removeClass("center").addClass( window.wui.logo_align );
					}
				    $('#logo').html(stamp);
				}
				else
				{
					// copyright
				    if ( window.wui.copyright && window.wui.copyright == "disable" )
				    {
				        $("#copyright").hide();
				    }
				    else
				    {
				        $("#copyright").show();
				    }
				}
				// username 
	            $('#username').val( "admin" );
				// passworkd
				page.password('password', 'password-icon' );
				// get the machine config and setup the language
				$.i18n().load( page.lang('index') ).then( function () { 
					$.i18n().locale = lang; $('body').i18n();
					/* focus on the input */
					$('#password').focus();
				})
			});

			// login
			$('#login').unbind(ace.click_event).on(ace.click_event, function () {
				var paramter = {};
				paramter["username"] = $("#username").val();
				paramter["password"] = base64.en5( $("#password").val(), $("#username").val(), window.machines.rand );
	            $.ajax({
	                'url':"/auth", 'type':'POST', 'timeout':0, 'async':true, 'contentType':'application/x-www-form-urlencoded', 'data':JSON.stringify(paramter),
	                'complete': function ( x, s )
	                {
	                    // string for Exception
	                    if ( x.responseText.indexOf("{" ) < 0 )
	                    {
	                        console.log( "Server Async Response String: "+x.responseText );
							if ( x.responseText == "Auth Error" )
							{
								window.location.href = 'login.html';
								return;
							}
							else if ( x.responseText == "Data Error"  )
							{
							}
	                    }
	                    else
	                    {
	                        var value = eval( "(" + x.responseText + ")" );
	                        if ( value == null )
	                        {
	                            console.log( "Server Response Not JSON: "+x.responseText );
	                            return;
	                        }
							if ( value["return"] == "true" )
							{
								localStorage.setItem( "key", value["key"] );
								localStorage.setItem( "username", value["username"] );
								window.location.href = 'index.html';
								return;
							}
							window.location.href = 'login.html';
	                    }
	                    if ( args && args.loading )
	                    {
	                        page.overlay2hide();
	                    }
	                }
	            });
			});

			$(document).on('click', '.toolbar a[data-target]', function(e) {
				e.preventDefault();
				var target = $(this).data('target');
				$('.widget-box.visible').removeClass('visible');//hide others
				$(target).addClass('visible');//show target
			});


		});
		</script>
