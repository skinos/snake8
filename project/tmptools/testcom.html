<!-- ajax layout which only needs content area -->
<div class="row">
    <div class="col-xs-12 form-btn-wrapper">
    <!-- HTML Begin -->
    <div class="form-horizontal" role="form">


    <!-- 运行状态 -->
    <div class="form-group">
      <label class="col-sm-3 control-label no-padding-right" data-i18n="Service State"></label>
      <div class="col-sm-9 form-right-text">
        <span id="service_state"></span>
      </div>
    </div>
    <!-- 进程ID -->
    <div class="form-group">
      <label class="col-sm-3 control-label no-padding-right" data-i18n="Service PID"></label>
      <div class="col-sm-9 form-right-text">
        <span id="service_pid"></span>
      </div>
    </div>
    <!-- 进程循环计数 -->
    <div class="form-group">
      <label class="col-sm-3 control-label no-padding-right" data-i18n="Current Loop"></label>
      <div class="col-sm-9 form-right-text">
        <span id="service_loop"></span>
      </div>
    </div>
    <!-- 操作 -->
    <div class="form-horizontal" role="form">
      <div class="form-group">
        <label class="col-sm-3 control-label no-padding-right"></label>
        <div class="col-sm-9">
          <div class="btn-group">
		    <!-- 启动进程 -->
            <button class="btn btn-second" data-i18n="Start Service" id="service_start"></button>
		    <!-- 停止进程 -->
            <button class="btn btn-danger" data-i18n="Stop Service" id="service_stop" style="display: none;"></button>
		    <!-- 修改进程循环计数 -->
            <button class="btn btn-warning" data-i18n="Modify Loop" id="loop_modify" style="display: none;"></button>
          </div>
        </div>
      </div>
    </div>



    <div class="hr hr32 hr-dotted"></div>
    <!-- Custom a status -->
    <div class="form-group">
        <label class="col-sm-3 control-label no-padding-right" data-i18n="Configure Status"></label>
        <div class="col-sm-9">
            <!-- status option -->
            <label><input id="status" class="ace ace-switch ace-switch-6" type="checkbox" /><span class="lbl"></span></label>
        </div>
    </div>

    <div id="statusSets" style="display: none;">

        <!-- Custom a property -->
        <div class="form-group">
            <label class="col-sm-3 control-label no-padding-right" data-i18n="Name"></label>
            <div class="col-sm-9">
                <!-- property input box -->
                <div class="clearfix"><input type="text" id="name" class="col-xs-10 col-sm-5" maxlength="128" /></div>
            </div>
        </div>

    </div><!--statusSets-->


    <!-- Button panel -->
    <div class="clearfix form-actions">
        <div class="col-md-offset-3 col-md-9">
            <!-- Refresh button -->
            <button class="btn btn-second" type="button" id="refresh"><span data-i18n="Refresh"></span></button>
            &nbsp; &nbsp; &nbsp;
            <!-- Apply button -->
            <button class="btn btn-main" type="button" id="apply"><span data-i18n="Apply"></span></button>
        </div>
    </div>



    </div>
    <!-- End of HTML -->
  </div><!-- /.col -->
</div><!-- /.row -->



<!-- page specific plugin scripts -->
<script type="text/javascript">
(function () {
    // Javascript Begin



    // Component full name
    var comname = "tmptools@testcom";
    // Component configure
    var comcfg;
    // Component Status
    var comstat;
    // Language file path, which automatically varies according to the system language type (named in prj.json)
    var langjson = base64.decode( page.param( 'lang', location.hash ) );

    // Get the component configuration from the system and fill it into the html
    function load_comcfg()
    {
        // Get the component configure from the system
        he.load( [ comname, comname+".status" ] ).then( function(v){
            // Get the component configure and stored to "comcfg"
            comcfg = v[0];
            if ( !comcfg )
            {
                comcfg = {};
            }
            // load the attribute "status"
            $('#status').prop( 'checked', able2boole(comcfg.status) );
            // load the attribute "property"
            $('#name').val( comcfg.name );
            // Bind function handling for status options to hide or display property input box when clicked
            $('#status').unbind('change').change(function () {
                // if select
                if ($(this).prop('checked'))
                {
                    // shopw
                    $('#statusSets').show();
                }
                // else
                else
                {
                    // hide
                    $('#statusSets').hide();
                }
            }).trigger('change');

            // Get the component status and stored to "comstat"
            comstat = v[1];
            if ( !comstat )
            {
                comstat = {};
            }
			if ( comstat.status )
			{
				$('#service_state').text( $.i18n(comstat.status) );
				if ( comstat.status == "running" )
				{
                    $('#service_start').hide();
                    $('#service_stop').show();
                    $('#loop_modify').show();
					if ( comstat.pid )
					{
						$('#service_pid').text( comstat.pid );
					}
					if ( comstat.loop )
					{
						$('#service_loop').text( comstat.loop );
					}
				}
			}
			else
			{
				$('#service_state').text( $.i18n("stopped") );
			}

        });
    }


    // Save the modified configure that from html and apply it to the component configuration
    function save_comcfg()
    {
        if ( !comcfg )
        {
            comcfg = {};
        }
        // copy a component configure
        var comcfgcopy = JSON.parse(JSON.stringify(comcfg));
        // get the attribute "status"
        comcfg.status = boole2able( $('#status').prop('checked') );
        if ( comcfg.status == "enable" )
        {
            // get the attribute "property"
            comcfg.name = $('#name').val();
        }
        // Compare copies to determine if component configure have been modified
        if ( ocompare( comcfg, comcfgcopy ) )
        {
            // If no modification message no modification does not need to apply
            page.alert( { message: $.i18n('Settings unchanged') } );
            return;
        }
        // Save the component configure
        he.exec( [ comname+"="+JSON.stringify(comcfg) ] ).then( function(){
            // hint succeed
            page.hint2succeed( $.i18n('Modify successfully') );
            // flash the page
            load_comcfg();
        });
    }

    // bind the start service
    $('#service_start').on(ace.click_event, function () {
        he.exec( [ comname+".start" ] ).then( function(v){
            var ret = v[0];
            if ( ret == true )
            {
              location.reload();
            }
        });
    });
    // bind the stop service
    $('#service_stop').on(ace.click_event, function () {
        he.exec( [ comname+".shut" ] ).then( function(v){
            var ret = v[0];
            if ( ret == true )
            {
              location.reload();
            }
        });
    });
	// bind the loop modify
    $('#loop_modify').on(ace.click_event, function () {
        page.prompt( { message: $.i18n('Input Loop'), callback:function(result){
            if ( result )
            { 
                he.exec( [ comname+".modify["+result+"]" ] ).then( function(v){
                    var ret = v[0];
                    if ( ret == true )
                    {
                      location.reload();
                    }
                });
            }
        } } );
    });

    // Load the language file
    $.i18n().load( page.lang(langjson) ).then( function () {
        // HTML language initialization
        $.i18n().locale = window.lang; $('body').i18n();
        // load the component configure
        load_comcfg();
        /* Bind refresh button */
        $('#refresh').on(ace.click_event, function () {
            location.reload();
        });
        /* Bind apply button */
        $('#apply').on(ace.click_event, function () {
            // Save and apply the component configuration when you click apply
            save_comcfg();
        });
    });



    // End of Javascript
})()
</script>
